name: Build Android APK and Windows EXE

on:
  push:
    tags: ['v*']          # e.g. git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:       # or run manually from the Actions tab (artifacts only, no release)

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Add Android platform
        run: npx cap add android
      - name: Generate app icons (falls back to default icon on failure)
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f6b73' --iconBackgroundColorDark '#0f6b73'
      - name: Sync web assets and plugins
        run: npx cap sync android
      - name: Build debug-signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: |
          NAME="${GITHUB_REF_NAME:-manual}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "PNLE-Study-Hub-${NAME}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: PNLE-Study-Hub-*-android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer and portable exe
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/PNLE-Study-Hub-Setup-*.exe
            dist/PNLE-Study-Hub-Portable-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: PNLE Study Hub ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Unofficial PNLE/NLE self-study app. Not affiliated with or endorsed by the PRC. Scores are for self-study only.
            - **Android:** install the `.apk` (allow "install unknown apps"). This is a debug-signed build for sideloading.
            - **Windows:** run `Setup` to install, or use the `Portable` exe without installing. Windows may show a SmartScreen warning because the app is not code-signed.
          files: out/*
