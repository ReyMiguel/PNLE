Q(5,'card',2,"A client in acute pulmonary edema has frothy pink sputum and severe dyspnea. Which position is best?",
 ["Supine flat","High Fowler's with legs dependent","Trendelenburg","Left lateral flat"],1,
 "Upright with legs down decreases venous return and eases breathing.",
 "Flat or head-down positions increase pulmonary congestion.",
 "High Fowler's na nakababa ang mga paa.","ml_hf");
Q(5,'card',3,"The monitor shows ventricular fibrillation in an unresponsive client with no pulse. What is the priority?",
 ["Give IV atropine","Start high-quality CPR and defibrillate as soon as a defibrillator is available","Check the blood pressure","Perform synchronized cardioversion"],1,
 "VF is a shockable rhythm: immediate CPR and defibrillation give the best chance of survival.",
 "Atropine and BP checks waste time; synchronized cardioversion is for rhythms with a pulse.",
 "CPR at defibrillation agad sa VF.","aha");
Q(5,'card',2,"What are the recommended adult CPR compression rate and depth?",
 ["60–80 per minute, 1 cm","100–120 per minute, at least 5 cm (2 inches), allowing full chest recoil","140–160 per minute, 8 cm","Any rate, 2.5 cm"],1,
 "High-quality CPR: 100–120 compressions/min, at least 5 cm (but not more than about 6 cm), full recoil, minimal interruptions.",
 "Slower or shallower compressions are ineffective; too fast or deep risks injury and poor refill.",
 "100–120/min at hindi bababa sa 5 cm ang lalim.","aha","Guidelines are periodically updated; confirm current recommendations.");
Q(5,'shock',3,"A client has suspected sepsis: temperature 39.2 °C, HR 120/min, RR 26/min, BP 82/50 mm Hg and lactate 4.2 mmol/L. Which actions are appropriate?",
 ["Wait 24 hours for cultures before giving antibiotics","Obtain blood cultures, give broad-spectrum antibiotics promptly and begin IV crystalloid resuscitation per orders","Give oral fluids only","Give an antipyretic only"],1,
 "Sepsis with hypotension and raised lactate needs rapid cultures (without delaying antibiotics), prompt antimicrobials and fluid resuscitation.",
 "Waiting for cultures or giving only antipyretics or oral fluids delays life-saving treatment.",
 "Kumuha ng blood cultures, magbigay agad ng antibiotics at IV fluids ayon sa order.","ssc","Targets and timing follow current Surviving Sepsis guidance and hospital protocol.");
Q(5,'renal',2,"During the oliguric phase of acute kidney injury, which complications should the nurse monitor most closely?",
 ["Hypokalemia and dehydration","Hyperkalemia and fluid overload","Polyuria","Hypernatremia from diarrhea"],1,
 "Reduced urine output causes retention of potassium, water and waste products.",
 "Hypokalemia and polyuria occur in other phases or conditions.",
 "Sa oliguric phase, bantayan ang hyperkalemia at fluid overload.","ml_kidney");
Q(5,'burn',3,"An adult weighing 70 kg has burns over 40% of the total body surface area. By the Parkland formula (4 mL × kg × %TBSA), how much fluid is given in the first 8 hours after the burn?",
 ["2,800 mL","5,600 mL","11,200 mL","1,400 mL"],1,
 "4 × 70 × 40 = 11,200 mL in 24 hours; half (5,600 mL) is given in the first 8 hours after the injury.",
 "11,200 mL is the 24-hour total; the others are calculation errors.",
 "4×70×40 = 11,200 mL/24 h; kalahati (5,600 mL) sa unang 8 oras.","ml_burn","The formula is a starting estimate; fluids are titrated to urine output and clinical response.");
Q(5,'burn',3,"Which finding in a client with facial burns most strongly suggests airway injury?",
 ["Pain at the burn site","Mild thirst","Singed nasal hair, hoarseness and carbonaceous sputum","Blisters on the forearm"],2,
 "Singed nasal hair, hoarseness and soot in sputum suggest inhalation injury with impending airway edema; early airway protection is critical.",
 "Pain, thirst and forearm blisters do not indicate airway involvement.",
 "Sunog na buhok sa ilong, paos at uling sa plema: pinsala sa daanan ng hangin.","ml_burn");
Q(5,'em',2,"During a mass-casualty incident using START triage, which victim is categorized as Immediate (red)?",
 ["Walking with a minor wound","Breathing at 36 breaths per minute","Not breathing even after airway repositioning","Fractured forearm, RR 20, radial pulse present, obeys commands"],1,
 "A respiratory rate above 30/min places a victim in the Immediate category.",
 "Walking wounded are minor (green); no breathing after repositioning is expectant/deceased (black); the forearm fracture victim is Delayed (yellow).",
 "RR >30/min ay Immediate (pula) sa START.","openstax","Triage systems and categories vary by local disaster plan.");
Q(5,'em',2,"Which is the antidote for acetaminophen overdose?",
 ["Naloxone","N-acetylcysteine","Flumazenil","Atropine"],1,
 "N-acetylcysteine replenishes glutathione and prevents hepatic injury, best given early.",
 "Naloxone reverses opioids, flumazenil reverses benzodiazepines, atropine treats cholinergic toxicity and bradycardia.",
 "N-acetylcysteine ang antidote sa acetaminophen.","ml_poison","Treatment decisions use timed levels and poison-control or provider guidance.");
Q(5,'em',2,"Which nursing measure reduces the risk of ventilator-associated pneumonia?",
 ["Keeping the head of the bed flat","Elevating the head of the bed to 30–45° unless contraindicated, and giving regular oral care","Routinely instilling saline before suctioning","Changing ventilator circuits daily"],1,
 "Head elevation, oral hygiene, sedation interruption and subglottic secretion management are core prevention bundle elements.",
 "Flat positioning raises aspiration risk; routine saline instillation and daily circuit changes are not recommended.",
 "Itaas ang ulo ng kama 30–45° at maglinis ng bibig nang regular.","openstax","Follow the current facility ventilator bundle.");

/* ---------- Nursing Practice I: expansion to 100 items (appended so existing question IDs stay unchanged) ---------- */
const NP1q=(t,d,q,o,r,w,f,s)=>Q(1,t,d,q,o,0,r,w,f,s);
NP1q('phc',1,"Which 1978 declaration made primary health care the key strategy for achieving Health for All?",
 ["Alma-Ata Declaration","Ottawa Charter","Geneva Convention","Declaration of Helsinki"],
 "The Declaration of Alma-Ata (1978) identified primary health care as the key to Health for All.",
 "The Ottawa Charter concerns health promotion; the Geneva Convention concerns humanitarian law; the Declaration of Helsinki concerns research ethics.",
 "Ang Alma-Ata Declaration ang nagtakda ng primary health care bilang susi sa Health for All.","doh");
NP1q('phc',1,"A nurse conducts a Pap smear screening in a barangay. At which level of prevention is this?",
 ["Secondary prevention","Primary prevention","Tertiary prevention","Health promotion only"],
 "Screening detects disease early, which is secondary prevention.",
 "Primary prevention stops disease before onset; tertiary prevention limits disability after disease is established.",
 "Ang screening ay maagang pagtuklas ng sakit kaya secondary prevention.","doh");
NP1q('phc',1,"A community health nurse teaches stroke survivors home exercises to regain function. Which level of prevention is this?",
 ["Tertiary prevention","Primary prevention","Secondary prevention","Case finding"],
 "Rehabilitation to limit disability and restore function is tertiary prevention.",
 "Primary prevention occurs before disease; secondary prevention is early detection; case finding is a screening activity.",
 "Ang rehabilitasyon upang maibalik ang kakayahan ay tertiary prevention.","doh");
NP1q('phc',2,"Under the Local Government Code (RA 7160), which change affected delivery of basic health services?",
 ["Basic health services were devolved to local government units","All hospitals were transferred to private owners","PhilHealth took over barangay health stations","Health services were centralized at the DOH only"],
 "RA 7160 devolved many basic health services to local government units (provinces, cities, municipalities).",
 "Hospitals were not privatized, PhilHealth is an insurer rather than a service provider, and the law decentralized rather than centralized services.",
 "Inilipat ng RA 7160 sa mga LGU ang maraming batayang serbisyong pangkalusugan.","doh");
NP1q('phc',1,"Which facility is the first point of contact between residents and the government health system in a barangay?",
 ["Barangay health station","Provincial hospital","Medical center","Regional laboratory"],
 "The barangay health station is the first-level, closest facility, staffed mainly by midwives and barangay health workers.",
 "Provincial hospitals and medical centers are higher referral levels; a regional laboratory is not a point of primary contact.",
 "Ang barangay health station ang pinakamalapit at unang pinupuntahan ng mamamayan.","doh");
NP1q('phc',2,"Which law aims to provide all Filipinos automatic PhilHealth coverage and access to a comprehensive health benefit package?",
 ["RA 11223, Universal Health Care Act","RA 9173, Philippine Nursing Act","RA 10173, Data Privacy Act","RA 10028, Expanded Breastfeeding Promotion Act"],
 "RA 11223 (Universal Health Care Act) automatically enrolls all Filipinos in the national health insurance program.",
 "RA 9173 regulates nursing practice, RA 10173 protects personal data, and RA 10028 supports breastfeeding.",
 "Ang RA 11223 ang awtomatikong nag-eenrol sa lahat ng Pilipino sa PhilHealth.","doh");
NP1q('phc',2,"A nurse lives in a community for several weeks to learn its culture, leaders and daily routines before organizing activities. Which phase of community organizing is this?",
 ["Integration","Evaluation","Sustenance","Mobilization"],
 "Living with and learning from the community to gain trust and understanding is integration.",
 "Evaluation and sustenance come after programs run; mobilization acts on identified problems.",
 "Ang pakikipamuhay at pag-aaral sa komunidad ay integration.","openrn");
NP1q('phc',2,"The Department of Education and the DOH jointly implement school-based deworming. Which primary health care principle is best illustrated?",
 ["Intersectoral collaboration","Appropriate technology","Self-reliance","Equity in distribution"],
 "Different sectors working together on a health goal is intersectoral collaboration.",
 "Appropriate technology concerns suitable tools, self-reliance concerns community independence, and equity concerns fair access.",
 "Ang magkasamang gawain ng DepEd at DOH ay intersectoral collaboration.","doh");
NP1q('phc',1,"A free outreach clinic is arranged for an island barangay that has no health facility. Which primary health care principle does this address best?",
 ["Equity","Community participation","Intersectoral collaboration","Self-reliance"],
 "Bringing services to underserved people addresses equity of access.",
 "The other principles do not center on fair access to services for those without them.",
 "Ang paghatid ng serbisyo sa mga walang akses ay equity.","doh");
NP1q('phc',1,"Community members organize daily Zumba sessions at the plaza on the nurse's advice. This activity is mainly:",
 ["Health promotion","Tertiary prevention","Case finding","Rehabilitation"],
 "Encouraging physical activity to build healthy habits is health promotion.",
 "Tertiary prevention and rehabilitation address existing disease; case finding is identification of cases.",
 "Ang pagsasanay ng malusog na gawi ay health promotion.","doh");
NP1q('phc',2,"The public health nurse in a rural health unit commonly supervises which health worker?",
 ["Rural health midwife","Municipal mayor","Hospital chief","Barangay captain"],
 "The public health nurse supervises rural health midwives, who in turn guide barangay health workers.",
 "The other people are not part of the technical nursing supervision line in the RHU.",
 "Pinangangasiwaan ng public health nurse ang rural health midwife.","doh");
NP1q('phc',2,"A nurse partners with barangay health workers to monitor household water sources. This approach primarily strengthens:",
 ["Community participation","Hospital referral","Private insurance","Tertiary care"],
 "Involving residents in monitoring builds community participation and local ownership.",
 "The other options do not describe involvement of residents in health action.",
 "Pinapalakas nito ang pakikilahok ng komunidad.","doh");
NP1q('epi',2,"In a barangay of 1,000 people at risk, 30 new dengue cases occur in a month. What is the incidence rate?",
 ["30 per 1,000","3 per 1,000","300 per 1,000","0.3 per 1,000"],
 "Incidence = new cases ÷ population at risk = 30 ÷ 1,000, or 30 per 1,000.",
 "The other values are arithmetic errors.",
 "30 bagong kaso ÷ 1,000 ang nasa panganib = 30 sa bawat 1,000.","openstax");
NP1q('epi',2,"Which formula gives the infant mortality rate?",
 ["Deaths under 1 year ÷ live births × 1,000","Deaths under 5 years ÷ population × 1,000","Fetal deaths ÷ total births × 1,000","Maternal deaths ÷ live births × 100,000"],
 "Infant mortality rate = deaths of infants under 1 year ÷ live births in the same period × 1,000.",
 "The other formulas describe under-five mortality, fetal death, and maternal mortality ratio.",
 "Ang infant mortality rate ay namatay na wala pang 1 taon ÷ ipinanganak na buhay × 1,000.","prc_tos");
NP1q('epi',2,"The maternal mortality ratio is usually expressed per how many live births?",
 ["100,000","1,000","10,000","10"],
 "The maternal mortality ratio is conventionally expressed per 100,000 live births.",
 "Smaller bases are used for other indicators such as infant mortality rate (per 1,000).",
 "Ang maternal mortality ratio ay sa bawat 100,000 buhay na ipinanganak.","prc_tos");
NP1q('epi',2,"A screening test correctly identifies 95 of 100 people who truly have the disease. This describes the test's:",
 ["Sensitivity","Specificity","Incidence","Prevalence"],
 "Sensitivity is the ability to correctly identify those with the disease (true positive rate).",
 "Specificity concerns correctly identifying those without disease; incidence and prevalence are disease frequencies.",
 "Ang sensitivity ay kakayahang tukuyin ang may sakit.","openstax");
NP1q('epi',2,"A test that correctly rules out disease in people who are healthy has high:",
 ["Specificity","Sensitivity","Incidence","Case fatality"],
 "Specificity is the ability to correctly identify those without disease (true negative rate).",
 "Sensitivity identifies those with disease; incidence and case fatality are not test properties.",
 "Ang specificity ay tamang pagtukoy sa walang sakit.","openstax");
NP1q('epi',3,"Researchers follow smokers and non-smokers for 10 years to compare lung cancer occurrence. Which design is this?",
 ["Cohort study","Case-control study","Cross-sectional survey","Case report"],
 "A cohort study follows groups defined by exposure forward in time to compare outcomes.",
 "A case-control study starts with outcomes and looks back; a cross-sectional survey measures at one time; a case report describes one patient.",
 "Ang cohort study ay sumusubaybay sa mga grupo pasulong sa panahon.","openstax");
NP1q('epi',3,"Researchers compare past exposures of people with a disease to people without it. Which design is this?",
 ["Case-control study","Cohort study","Randomized controlled trial","Cross-sectional survey"],
 "Case-control studies start with those with and without the outcome and look back at exposure.",
 "Cohort studies follow forward; randomized trials assign interventions; cross-sectional surveys measure at one time point.",
 "Ang case-control ay nagsisimula sa kinalabasan at tumitingin paatras.","openstax");
NP1q('epi',1,"The epidemiologic triad consists of:",
 ["Agent, host and environment","Person, place and time","Incidence, prevalence and mortality","Source, route and sink"],
 "The triad describes disease causation through agent, host and environment.",
 "Person, place and time describe descriptive epidemiology; the others are not the triad.",
 "Ang epidemiologic triad ay agent, host at environment.","openstax");
NP1q('epi',2,"At the start of a suspected outbreak investigation, the nurse's first priority is to:",
 ["Verify the diagnosis and confirm that an outbreak exists","Close all schools","Begin mass treatment","Publish the findings"],
 "Investigation begins by verifying diagnoses and confirming that cases exceed the expected number.",
 "Control measures and reporting follow confirmation and case definition.",
 "Una ang pagkumpirma ng diagnosis at ng outbreak.","doh");
NP1q('epi',2,"Thirty guests become ill with vomiting within hours of eating the same buffet at a party. This epidemic pattern suggests:",
 ["A common point-source exposure","A continuous common source","Person-to-person spread only","Endemic disease"],
 "A sudden cluster after one shared exposure suggests a point-source outbreak.",
 "Continuous or person-to-person patterns show cases over a longer or staggered period; endemic means usual presence.",
 "Biglaang kumpol ng kaso mula sa iisang pagkain ay point-source.","openstax");
NP1q('epi',2,"A research team gives every resident in a barangay list an equal chance of selection. This is:",
 ["Simple random sampling","Convenience sampling","Quota sampling","Purposive sampling"],
 "Giving every member an equal, independent chance of selection is simple random sampling.",
 "The other methods rely on availability or judgment, not equal chance.",
 "Pantay ang tsansang mapili ang bawat isa sa simple random sampling.","openrn");
NP1q('epi',2,"Number of deaths from all causes in a year ÷ midyear population × 1,000 is the:",
 ["Crude death rate","Case fatality rate","Infant mortality rate","Maternal mortality ratio"],
 "That formula defines the crude death rate.",
 "Case fatality concerns deaths among those with a specific disease; the other two are specific rates.",
 "Ito ang crude death rate.","prc_tos");
NP1q('cd',1,"A child with dengue has fever. Which medicine is appropriate for the fever?",
 ["Paracetamol","Aspirin","Ibuprofen","Mefenamic acid"],
 "Paracetamol is recommended; aspirin and NSAIDs increase bleeding risk.",
 "Aspirin, ibuprofen and mefenamic acid are NSAIDs and should be avoided in dengue.",
 "Paracetamol ang ligtas; iwasan ang aspirin at NSAIDs.","who_dengue");
NP1q('cd',2,"Which finding in a dengue client around the time the fever subsides requires urgent referral?",
 ["Persistent vomiting and severe abdominal pain","Mild headache","Mild muscle aches","Runny nose"],
 "Persistent vomiting and severe abdominal pain are warning signs of severe dengue.",
 "Mild headache, myalgia and rhinorrhea are common and not warning signs.",
 "Ang patuloy na pagsusuka at matinding pananakit ng tiyan ay warning signs.","who_dengue");
NP1q('cd',1,"Which measure is the most effective community-level prevention of dengue?",
 ["Search and destroy mosquito breeding sites","Routine antibiotics for all residents","Quarantine of all households","Fogging only after cases rise"],
 "Eliminating Aedes breeding sites such as stagnant water in containers is the key preventive measure.",
 "Antibiotics do not prevent a viral disease; quarantine is not recommended; fogging is a limited supplementary measure.",
 "Ang pagsira ng pinamumugaran ng lamok ang pinakamabisa.","who_dengue");
NP1q('cd',2,"A newly diagnosed drug-susceptible TB client starts the intensive phase. Which drugs are included?",
 ["Isoniazid, rifampicin, pyrazinamide and ethambutol","Isoniazid and rifampicin only","Streptomycin only","Amoxicillin and rifampicin"],
 "The standard intensive phase uses four drugs: isoniazid, rifampicin, pyrazinamide and ethambutol.",
 "Fewer drugs risk resistance; the other combinations are not standard.",
 "Apat na gamot ang intensive phase: isoniazid, rifampicin, pyrazinamide, ethambutol.","who_tb");
NP1q('cd',1,"A client taking rifampicin reports orange-red urine. The nurse should say:",
 ["This is an expected harmless effect","Stop the medicine immediately","This signals kidney failure","This signals a drug allergy"],
 "Rifampicin colors urine, sweat and tears orange-red; it is expected and harmless.",
 "Stopping the drug risks resistance; the color change is not renal failure or allergy.",
 "Normal ang kulay kahel na ihi sa rifampicin.","who_tb");
NP1q('cd',2,"Which vitamin is given with isoniazid to prevent peripheral neuropathy?",
 ["Pyridoxine (vitamin B6)","Vitamin C","Vitamin K","Vitamin D"],
 "Pyridoxine helps prevent isoniazid-related peripheral neuropathy.",
 "The other vitamins do not address this adverse effect.",
 "Ang pyridoxine (B6) ay pumipigil sa neuropathy mula sa isoniazid.","who_tb");
NP1q('cd',2,"A client on TB therapy reports blurred vision and difficulty seeing colors. Which drug is most likely responsible?",
 ["Ethambutol","Rifampicin","Pyrazinamide","Isoniazid"],
 "Ethambutol can cause optic neuritis; vision changes should be reported promptly.",
 "Rifampicin colors fluids, pyrazinamide raises uric acid, and isoniazid may cause neuropathy and hepatotoxicity.",
 "Ang ethambutol ay maaaring magdulot ng optic neuritis.","who_tb");
NP1q('cd',1,"The main purpose of directly observed treatment (DOT) in TB is to:",
 ["Ensure adherence and prevent drug resistance","Reduce the cost of drugs","Replace sputum testing","Shorten the treatment to one month"],
 "A health worker watches the client swallow each dose to ensure adherence and prevent resistance.",
 "DOT does not change drug cost or replace testing, and does not shorten therapy.",
 "Tinitiyak ng DOT na iniinom ang gamot at napipigilan ang resistensya.","who_tb");
NP1q('cd',1,"For sputum collection to detect TB, the best specimen is:",
 ["An early-morning specimen","A specimen after meals","Saliva only","A specimen after using mouthwash"],
 "An early-morning specimen contains pooled secretions and gives the best yield.",
 "Saliva and specimens contaminated by food or mouthwash reduce diagnostic quality.",
 "Pinakamainam ang plema sa umaga.","who_tb");
NP1q('cd',2,"Which preventive measure may be given to high-risk persons after flood exposure to reduce leptospirosis risk?",
 ["Doxycycline prophylaxis as directed by health authorities","Aspirin","Oral rehydration solution only","Vitamin A"],
 "Doxycycline chemoprophylaxis is used for high-risk exposure to flood water contaminated by animal urine.",
 "The other options do not prevent leptospirosis.",
 "Doxycycline ang prophylaxis ayon sa direksyon ng health authority.","doh");
NP1q('cd',1,"First aid for an animal bite wound includes:",
 ["Washing with soap and running water for at least 15 minutes","Applying tobacco or herbs","Tight tourniquet above the wound","Suturing the wound immediately"],
 "Thorough washing with soap and running water for at least 15 minutes reduces virus load.",
 "Folk remedies and tourniquets are harmful; immediate suturing is discouraged.",
 "Hugasan nang may sabon at tubig nang hindi bababa sa 15 minuto.","who_rabies");
NP1q('cd',2,"A stray dog bites a child, breaking the skin and causing bleeding. This is Category III exposure. Management includes:",
 ["Wound washing, rabies vaccine and rabies immunoglobulin","Wound washing only","Observation only","Antibiotics only"],
 "Category III exposure requires wound care, vaccine series and immunoglobulin.",
 "Washing alone or observation is insufficient for transdermal exposure.",
 "Sa Category III, kailangan ng pagpapahid, bakuna at RIG.","who_rabies");
NP1q('cd',2,"A resident in a malaria-endemic area asks how to prevent infection. The best advice is to:",
 ["Sleep under insecticide-treated nets","Avoid eating at night","Boil all drinking water","Use only oral rehydration"],
 "Malaria is spread by night-biting Anopheles mosquitoes; insecticide-treated nets reduce bites.",
 "Diet, boiling water and rehydration do not prevent mosquito-borne infection.",
 "Gumamit ng kulambo na may insecticide.","doh");
NP1q('cd',2,"Which statement about schistosomiasis prevention is correct?",
 ["Avoid contact with water in snail-infested areas","Avoid undercooked pork","Eliminate Aedes breeding sites","Wear a mask in crowded places"],
 "Infection occurs through skin contact with water containing cercariae released by snails; avoiding such water prevents it.",
 "The other measures relate to other diseases.",
 "Iwasan ang tubig na may suso na nagdadala ng parasito.","doh");
NP1q('cd',1,"Koplik spots are characteristic of which disease?",
 ["Measles","Varicella","Pertussis","Mumps"],
 "Koplik spots on the buccal mucosa are a hallmark of measles.",
 "Varicella causes vesicles, pertussis causes paroxysmal cough, and mumps causes parotid swelling.",
 "Ang Koplik spots ay palatandaan ng tigdas.","cdc_iso");
NP1q('cd',2,"A child with watery diarrhea and some dehydration is brought to the health center. Initial management is:",
 ["Oral rehydration solution with zinc supplementation","Antibiotics for all cases","Withholding fluids","Antidiarrheal drugs"],
 "ORS replaces fluid and electrolytes, and zinc reduces duration and severity.",
 "Most watery diarrhea does not need antibiotics; fluids should not be withheld; antidiarrheals are not recommended in children.",
 "ORS at zinc ang unang gamutan.","who_peds");
NP1q('imm',1,"What is the recommended storage temperature for most vaccines?",
 ["2–8 °C","-20 °C","15–25 °C","Above 30 °C"],
 "Most vaccines are stored at 2–8 °C in the refrigerator.",
 "Freezing or heat damages many vaccines.",
 "Imbak ang bakuna sa 2–8 °C.","doh");
NP1q('imm',2,"Which vaccine must never be frozen because freezing damages it?",
 ["Hepatitis B vaccine","Oral polio vaccine","BCG","Measles vaccine"],
 "Hepatitis B vaccine and other adjuvanted vaccines are freeze-sensitive.",
 "OPV, BCG and measles vaccines are freeze-dried or tolerate freezing.",
 "Ang hepatitis B vaccine ay nasisira kapag na-freeze.","doh");
NP1q('imm',1,"BCG vaccine is given by which route?",
 ["Intradermal","Subcutaneous","Intramuscular","Oral"],
 "BCG is injected intradermally, forming a small wheal.",
 "Other routes would not give the intended local response.",
 "Intradermal ang BCG.","doh");
NP1q('imm',1,"When should the hepatitis B birth dose be given?",
 ["Within 24 hours of birth","At 6 months","At 1 year","At school entry"],
 "The birth dose is given within 24 hours to prevent perinatal transmission.",
 "Later doses miss the critical window.",
 "Ibigay ang hepatitis B sa loob ng 24 oras mula kapanganakan.","doh");
NP1q('imm',1,"A child has a mild cold with a low-grade fever and is due for immunization. The nurse should:",
 ["Proceed with vaccination","Postpone for 3 months","Refuse all vaccines","Prescribe antibiotics first"],
 "Mild illness is not a contraindication to vaccination.",
 "Delaying or refusing causes missed opportunities.",
 "Ang banayad na sipon ay hindi hadlang sa bakuna.","doh");
NP1q('imm',2,"Which condition is a true contraindication to further doses of a vaccine?",
 ["Anaphylaxis after the previous dose","Mild fever","Mild diarrhea","Mild cough"],
 "A severe allergic reaction to a previous dose is a true contraindication.",
 "The other conditions are minor illnesses and not contraindications.",
 "Anaphylaxis sa nakaraang dosis ay tunay na contraindication.","doh");
NP1q('imm',2,"Which vaccine should be avoided during pregnancy?",
 ["MMR (live attenuated)","Tetanus toxoid","Inactivated influenza","Hepatitis B"],
 "Live attenuated vaccines such as MMR are contraindicated in pregnancy because of theoretical fetal risk.",
 "Tetanus toxoid, inactivated influenza and hepatitis B are non-live and acceptable.",
 "Iwasan ang live vaccine tulad ng MMR sa buntis.","doh");
NP1q('imm',1,"After giving a vaccine, the nurse should observe the client for at least:",
 ["15 minutes","1 minute","3 hours","24 hours"],
 "Observing for at least 15 minutes allows prompt recognition and management of allergic reactions.",
 "The other durations are too short or unnecessarily long.",
 "Obserbahan nang hindi bababa sa 15 minuto.","cdc_sp");
NP1q('imm',1,"In the Philippine EPI schedule, the first dose of measles-containing vaccine is given at:",
 ["9 months","6 weeks","15 months","5 years"],
 "The first measles-containing dose is given at 9 months, followed by a second dose at 12 months.",
 "Other ages do not match the schedule.",
 "Ang unang dosis ng measles ay sa 9 na buwan.","doh");
NP1q('imm',2,"On a vaccine vial monitor, the inner square becomes darker than the outer circle. The nurse should:",
 ["Discard the vaccine","Use it first","Freeze it","Use it only for adults"],
 "A darker inner square indicates cumulative heat exposure and the vaccine must be discarded.",
 "Using, freezing or restricting it does not restore potency.",
 "Itapon ang bakuna kapag mas maitim ang loob na parisukat.","doh");
NP1q('fam',2,"A couple expecting their first baby is classified under the Bailon–Maglaya categories as:",
 ["Foreseeable crisis","Health deficit","Health threat","Wellness state"],
 "Anticipated stress points such as childbirth are foreseeable crises.",
 "Health deficit means existing illness; health threat means conditions likely to cause disease; wellness means no problems.",
 "Ang inaasahang pagbabago tulad ng panganganak ay foreseeable crisis.","openrn");
NP1q('fam',2,"A family without a sanitary toilet is classified as having a:",
 ["Health threat","Health deficit","Foreseeable crisis","Wellness state"],
 "Conditions that may lead to disease, such as poor sanitation, are health threats.",
 "A health deficit is an existing illness; a foreseeable crisis is an anticipated stress point.",
 "Ang kakulangan sa kalinisan ay health threat.","openrn");
NP1q('fam',2,"A father diagnosed with hypertension is a family problem classified as a:",
 ["Health deficit","Health threat","Foreseeable crisis","Wellness state"],
 "An actual diagnosed illness is a health deficit.",
 "Health threat concerns conditions that may lead to disease.",
 "Ang aktuwal na sakit ay health deficit.","openrn");
NP1q('fam',1,"The main purpose of the bag technique during a home visit is to:",
 ["Prevent cross-contamination","Show authority","Save time only","Replace hand washing"],
 "The bag technique reduces transfer of microorganisms between homes and the nurse's bag.",
 "It does not replace hand hygiene.",
 "Pinipigilan ng bag technique ang paglipat ng mikrobyo.","openrn");
NP1q('fam',1,"At the start of a home visit, the nurse should first:",
 ["Greet the family and establish rapport","Start giving injections","Inspect the kitchen","Leave a leaflet"],
 "Establishing rapport builds trust and cooperation.",
 "The other actions skip rapport.",
 "Magpakilala at bumuo ng tiwala sa simula.","openrn");
NP1q('fam',2,"Which tool depicts a family's relationships and health patterns across generations?",
 ["Genogram","Ecomap","Growth chart","Partograph"],
 "A genogram diagrams family members and relationships over generations.",
 "An ecomap shows links with outside systems; the others are unrelated.",
 "Ang genogram ay larawan ng pamilya sa mga henerasyon.","openrn");
NP1q('fam',2,"Which tool shows the family's connections with community resources and outside systems?",
 ["Ecomap","Genogram","Partograph","Growth chart"],
 "An ecomap depicts the family's relationships with external systems.",
 "A genogram focuses on the family tree.",
 "Ang ecomap ay koneksyon ng pamilya sa labas na sistema.","openrn");
NP1q('fam',1,"A mother correctly demonstrates how to bathe her newborn. Which domain of learning is shown?",
 ["Psychomotor","Cognitive","Affective","Receptive"],
 "Performing a skill reflects psychomotor learning.",
 "Cognitive is knowing; affective is attitudes and values.",
 "Ang pagsasagawa ng kasanayan ay psychomotor.","openrn");
NP1q('fam',2,"A nurse wants a mother to value exclusive breastfeeding. Which domain is targeted?",
 ["Affective","Cognitive","Psychomotor","Receptive"],
 "Developing values and attitudes is the affective domain.",
 "Cognitive concerns knowledge and psychomotor concerns skills.",
 "Ang pagpapahalaga ay affective.","openrn");
NP1q('fam',1,"A client in severe pain is not ready to learn. The nurse should first:",
 ["Relieve the pain, then teach","Teach quickly","Give a pamphlet only","Postpone indefinitely"],
 "Readiness to learn requires that urgent physical needs be addressed first.",
 "Teaching during severe pain is ineffective.",
 "Alisin muna ang sakit bago magturo.","openrn");
NP1q('fam',2,"Which best confirms that teaching about insulin injection was effective?",
 ["Return demonstration of the technique","Client nods","Client says yes","Client takes a leaflet"],
 "Return demonstration shows the client can perform the skill.",
 "The other responses do not prove skill acquisition.",
 "Ang return demonstration ang patunay.","openrn");
NP1q('fam',2,"When teaching adult learners, the nurse should:",
 ["Link content to their experience and immediate needs","Lecture only","Use complex terms","Avoid questions"],
 "Adults learn best when content is relevant, practical and builds on experience.",
 "The other approaches reduce engagement.",
 "Iugnay ang aralin sa karanasan at pangangailangan ng matanda.","openrn");
NP1q('prof',1,"Obtaining informed consent before a procedure respects which ethical principle?",
 ["Autonomy","Justice","Fidelity","Veracity"],
 "Informed consent honors the client's right to decide.",
 "Justice is fairness; fidelity is promise-keeping; veracity is truth-telling.",
 "Ang informed consent ay paggalang sa autonomy.","ra9173");
NP1q('prof',2,"A nurse delegates a task to an assistive worker. Who remains accountable for the outcome?",
 ["The delegating nurse","The assistive worker alone","The client","No one"],
 "The delegator retains accountability for appropriate delegation and supervision.",
 "Responsibility for the task may be shared, but accountability remains.",
 "Nananatili ang pananagutan ng nars na nag-delegate.","ra9173");
NP1q('prof',2,"A nurse posts a client's photo online without consent. This violates:",
 ["Confidentiality and the Data Privacy Act (RA 10173)","The Nursing Act only","The EPI schedule","The Magna Carta of Women"],
 "Sharing identifiable health information without consent breaches privacy and data protection law.",
 "The other options do not address this action.",
 "Paglabag ito sa privacy at RA 10173.","ra10173");
NP1q('ic',1,"Hand hygiene primarily breaks which link in the chain of infection?",
 ["Mode of transmission","Reservoir","Agent","Susceptible host"],
 "Clean hands prevent transfer of microorganisms by contact.",
 "The other links are not directly broken by hand hygiene.",
 "Pinuputol ng hand hygiene ang mode of transmission.","who_hh");
NP1q('ic',2,"Hands are visibly soiled, or the client has C. difficile. The nurse should use:",
 ["Soap and water","Alcohol-based rub","Water only","Sanitizing wipes"],
 "Soap and water are required for visible soil and for spore-forming organisms.",
 "Alcohol rubs do not kill C. difficile spores.",
 "Sabon at tubig ang gamitin.","who_hh");
NP1q('ic',1,"Which personal protective equipment item is put on first?",
 ["Gown","Mask","Goggles","Gloves"],
 "The usual sequence is gown, mask or respirator, eye protection, then gloves.",
 "Gloves go on last so they cover the gown cuffs.",
 "Una ang gown, huli ang guwantes.","cdc_sp");
NP1q('ic',1,"A client with suspected pulmonary TB should be placed on which precautions?",
 ["Airborne precautions with N95 respirator","Contact precautions only","Droplet precautions with surgical mask","Standard precautions only"],
 "TB spreads by airborne particles needing a respirator and, when available, negative-pressure room.",
 "Surgical masks are inadequate for airborne spread.",
 "Airborne precautions at N95 ang kailangan.","cdc_iso");
NP1q('ic',1,"Pertussis requires which transmission-based precautions?",
 ["Droplet precautions","Airborne precautions","Contact precautions only","None"],
 "Pertussis spreads through large respiratory droplets, so a surgical mask is used within close range.",
 "Airborne precautions apply to TB, measles and varicella.",
 "Droplet precautions ang sa pertussis.","cdc_iso");
NP1q('ic',1,"After giving an injection, the nurse should:",
 ["Dispose of the needle uncapped in a puncture-resistant container","Recap with two hands","Throw it in regular trash","Bend the needle"],
 "Do not recap; discard immediately in a sharps container.",
 "The other actions risk needlestick injury.",
 "Itapon ang karayom sa sharps container nang hindi tinatakpan.","cdc_sp");

NP1q('phc',2,"According to the PRC table, Practice I covers non-communicable diseases. In adults, which BP reading is classified as hypertension?",
 ["140/90 mmHg or higher on repeated measurements","120/80 mmHg","110/70 mmHg","100/60 mmHg"],
 "Hypertension is generally defined as a BP of 140/90 mmHg or higher on repeated measurements.",
 "The other readings are normal or low.",
 "Ang hypertension ay 140/90 mmHg pataas sa paulit-ulit na sukat.","prc_tos");
NP1q('phc',2,"Which fasting blood glucose value is diagnostic of diabetes mellitus?",
 ["126 mg/dL or higher","90 mg/dL","100 mg/dL","70 mg/dL"],
 "A fasting plasma glucose of 126 mg/dL or higher, confirmed, indicates diabetes.",
 "The lower values are normal or only suggest impaired fasting glucose.",
 "126 mg/dL pataas ang diabetes.","ada");
NP1q('phc',1,"A nurse teaches a community that a sore that does not heal and unusual bleeding are cancer warning signs. Which mnemonic is used?",
 ["CAUTION","FAST","APGAR","SOAP"],
 "CAUTION lists the seven warning signs of cancer.",
 "FAST is for stroke, APGAR for newborn assessment, and SOAP for charting.",
 "Ang CAUTION ay mga babalang senyales ng kanser.","prc_tos");
NP1q('phc',1,"Which advice best reduces risk factors for non-communicable diseases?",
 ["Stop smoking, eat less salt, exercise and limit alcohol","Increase salt intake","Avoid all physical activity","Take antibiotics daily"],
 "Tobacco, unhealthy diet, inactivity and harmful alcohol use are the main modifiable risk factors.",
 "The other options raise risk or do nothing for NCDs.",
 "Iwasan ang yosi, bawasan ang asin, mag-ehersisyo at limitahan ang alak.","who_diet");
NP1q('phc',2,"A client says chest pain, sweating and shortness of breath started an hour ago. The nurse's priority is to:",
 ["Refer immediately for emergency care","Advise rest at home","Give a herbal drink","Recheck tomorrow"],
 "These signs suggest acute coronary syndrome and require immediate emergency referral.",
 "Delay risks death.",
 "Agarang i-refer sa emergency.","aha");
NP1q('epi',2,"In a study of health education effects, the variable the researcher manipulates is called the:",
 ["Independent variable","Dependent variable","Extraneous variable","Constant"],
 "The independent variable is the intervention manipulated; the dependent variable is the outcome measured.",
 "The other terms do not describe the manipulated factor.",
 "Ang independent variable ang binabago ng mananaliksik.","openrn");
NP1q('epi',1,"Before enrolling residents in a barangay research study, the researcher must first:",
 ["Obtain informed consent","Publish results","Give incentives","Hide the purpose"],
 "Voluntary informed consent is a basic ethical requirement of research.",
 "The other actions do not protect participants.",
 "Kailangan muna ang informed consent.","openrn");

/* ---------- Nursing Practice II: expansion to 100 items (appended so existing question IDs stay unchanged) ---------- */
const NP2q=(t,d,q,o,r,w,f,s)=>Q(2,t,d,q,o,0,r,w,f,s);
NP2q('ante',2,"A client's last menstrual period began on March 10. Using Naegele's rule, what is her expected date of delivery?",
 ["December 17","December 10","January 17","November 17"],
 "Naegele's rule: subtract 3 months and add 7 days to the first day of the LMP, giving December 17.",
 "The other dates are calculation errors.",
 "LMP Marso 10: bawasan ng 3 buwan at dagdagan ng 7 araw = Disyembre 17.","openrn");
NP2q('ante',2,"A nurse palpates the fundus at the level of the umbilicus. This usually corresponds to about how many weeks of gestation?",
 ["20 weeks","12 weeks","28 weeks","36 weeks"],
 "The fundus reaches the umbilicus at about 20 weeks; from 20 to 34 weeks fundal height in cm roughly equals weeks.",
 "At 12 weeks it is just above the symphysis; later weeks are higher.",
 "Sa 20 linggo ang fundus ay nasa pusod.","openrn");
NP2q('ante',3,"A woman is pregnant for the fourth time. She has had two term deliveries, one abortion, and has two living children. What is her GTPAL?",
 ["G4 T2 P0 A1 L2","G3 T2 P0 A1 L2","G4 T2 P1 A1 L2","G4 T1 P0 A2 L2"],
 "G = 4 including the current pregnancy; T = 2; P = 0; A = 1; L = 2.",
 "The other options miscount gravidity or parity components.",
 "G4 dahil kasama ang kasalukuyang pagbubuntis; T2 P0 A1 L2.","openrn");
NP2q('ante',2,"Bluish discoloration of the cervix and vagina (Chadwick's sign) is classified as which type of sign?",
 ["Probable","Presumptive","Positive","Diagnostic"],
 "Chadwick's sign is a probable sign because it can occur with other conditions.",
 "Presumptive signs are subjective symptoms; positive signs are definite proof such as fetal heart tones.",
 "Ang Chadwick's sign ay probable sign.","openrn");
NP2q('ante',1,"Which finding is a positive sign of pregnancy?",
 ["Fetal heart tones heard by the examiner","Amenorrhea","Nausea in the morning","Breast tenderness"],
 "Fetal heart tones heard by the examiner (or ultrasound visualization of the fetus) are positive signs.",
 "Amenorrhea, nausea and breast tenderness are presumptive signs.",
 "Ang tunog ng puso ng sanggol ay positive sign.","openrn");
NP2q('ante',1,"Folic acid supplementation before and early in pregnancy helps prevent:",
 ["Neural tube defects","Rh isoimmunization","Gestational diabetes","Preterm labor"],
 "Folic acid lowers the risk of neural tube defects such as spina bifida.",
 "The other conditions are not prevented by folic acid.",
 "Pinipigilan ng folic acid ang neural tube defect.","who_anc");
NP2q('ante',1,"To improve absorption of an iron supplement, the nurse should advise taking it with:",
 ["Orange juice","Milk","Tea","Coffee"],
 "Vitamin C enhances iron absorption; milk, tea and coffee reduce it.",
 "Calcium in milk and tannins in tea and coffee hinder absorption.",
 "Inumin ang iron kasama ng vitamin C tulad ng orange juice.","who_anc");
NP2q('ante',1,"Which fetal heart rate range is normal at term?",
 ["110–160 beats per minute","60–100 beats per minute","170–200 beats per minute","80–100 beats per minute"],
 "A normal baseline fetal heart rate is 110–160 beats per minute.",
 "The other ranges indicate bradycardia or tachycardia.",
 "Normal ang 110–160 beses kada minuto.","openrn");
NP2q('ante',2,"A primigravida asks when she will first feel fetal movement. The nurse tells her it usually occurs at:",
 ["16–20 weeks","6–8 weeks","10–12 weeks","30–32 weeks"],
 "Quickening is usually felt at 16–20 weeks of gestation.",
 "Earlier weeks are too early; later weeks are too late.",
 "Ang quickening ay nararamdaman sa 16–20 linggo.","openrn");
NP2q('ante',2,"According to WHO, the minimum number of antenatal care contacts recommended for a positive pregnancy experience is:",
 ["Eight","Two","Four","Twelve"],
 "WHO recommends a minimum of eight contacts with a health care provider during pregnancy.",
 "Fewer contacts do not meet the current recommendation.",
 "Walong kontak ang inirerekomenda ng WHO.","who_anc");
NP2q('labor',1,"The first stage of labor ends when the cervix is:",
 ["Fully dilated to 10 cm","Dilated 4 cm","Effaced 50%","Closed"],
 "The first stage begins with regular contractions and ends at full dilation (10 cm).",
 "Other findings occur earlier in labor.",
 "Nagtatapos ang unang yugto sa 10 cm na dilation.","openrn");
NP2q('labor',2,"A laboring client at 9 cm becomes irritable, nauseated and says she cannot go on. This is the:",
 ["Transition phase","Latent phase","Active phase","Third stage"],
 "Transition (8–10 cm) is marked by irritability, nausea, trembling and loss of control.",
 "Latent and active phases come earlier; the third stage is placental delivery.",
 "Ang transition phase ay 8–10 cm na may iritable at nasusuka.","openrn");
NP2q('labor',2,"Which cardinal movement of labor occurs immediately after flexion?",
 ["Internal rotation","Extension","External rotation","Restitution"],
 "The order is engagement, descent, flexion, internal rotation, extension, restitution, external rotation and expulsion.",
 "The other movements occur later in the sequence.",
 "Pagkatapos ng flexion ay internal rotation.","openrn");
NP2q('labor',1,"The fetal head is at station 0. This means the presenting part is:",
 ["At the level of the ischial spines","Floating above the pelvis","Crowning at the perineum","At the pelvic outlet"],
 "Station 0 is at the level of the ischial spines.",
 "Floating is -5; crowning is about +4 to +5.",
 "Station 0 ay nasa ischial spines.","openrn");
NP2q('labor',3,"The nurse sees late decelerations on the fetal monitor. What is the priority action?",
 ["Turn the client to her left side and give oxygen","Increase oxytocin","Prepare for discharge","Encourage pushing"],
 "Late decelerations suggest uteroplacental insufficiency; reposition left, give oxygen, increase IV fluids and stop oxytocin.",
 "Increasing oxytocin or pushing worsens fetal hypoxia.",
 "Ilipat sa kaliwa at bigyan ng oxygen.","openrn");
NP2q('labor',2,"Early decelerations during contractions are caused by:",
 ["Head compression","Cord compression","Placental insufficiency","Maternal fever"],
 "Early decelerations mirror contractions and reflect head compression; they are benign.",
 "Cord compression produces variable decelerations; placental insufficiency produces late decelerations.",
 "Ang early deceleration ay dulot ng pagdiin sa ulo.","openrn");
NP2q('labor',2,"Variable decelerations are most often caused by:",
 ["Umbilical cord compression","Head compression","Uteroplacental insufficiency","Maternal hypotension"],
 "Variable decelerations vary in timing and shape and reflect cord compression; changing position may help.",
 "The other causes produce early or late patterns.",
 "Ang variable deceleration ay dulot ng pagipit sa pusod.","openrn");
NP2q('labor',3,"The nurse sees a loop of cord protruding from the vagina. The priority action is to:",
 ["Place her in knee-chest position and elevate the presenting part by hand","Push the cord back in","Encourage pushing","Apply fundal pressure"],
 "Relieve cord compression by lifting the presenting part and using knee-chest or Trendelenburg position, then prepare for emergency delivery.",
 "Pushing or fundal pressure worsens compression.",
 "Itaas ang presenting part at knee-chest position.","openrn");
NP2q('labor',2,"A client's membranes rupture spontaneously. Which action comes first?",
 ["Check the fetal heart rate","Document the color only","Prepare for discharge","Begin an enema"],
 "After rupture, first assess fetal heart rate for cord prolapse, then note fluid color, amount and odor.",
 "The other actions do not address the immediate risk.",
 "Unahin ang pagsuri sa tibok ng puso ng sanggol.","openrn");
NP2q('labor',1,"Contraction frequency is measured from:",
 ["The beginning of one contraction to the beginning of the next","The peak to the end","The end of one to the beginning of the next","The beginning to the end"],
 "Frequency is timed from the start of one contraction to the start of the next; duration is start to end.",
 "The other measures describe intervals or duration.",
 "Sukatin mula simula ng isa hanggang simula ng susunod.","openrn");
NP2q('pp',1,"One hour after delivery, the fundus is boggy. The first action is to:",
 ["Massage the fundus","Apply ice to the perineum","Encourage ambulation","Document only"],
 "A boggy fundus indicates uterine atony; fundal massage promotes contraction.",
 "The other actions do not control atony.",
 "Imasahe ang fundus kapag malambot.","openrn");
NP2q('pp',1,"Normal lochia progresses in which order?",
 ["Rubra, serosa, alba","Alba, serosa, rubra","Serosa, rubra, alba","Rubra, alba, serosa"],
 "Lochia is red (rubra), then pink-brown (serosa), then white-yellow (alba).",
 "The other sequences are incorrect.",
 "Rubra, serosa, alba ang tamang pagkakasunod.","openrn");
NP2q('pp',2,"Normally the fundus descends about how much per day after delivery?",
 ["1 cm (one fingerbreadth)","5 cm","0.1 cm","3 cm"],
 "The fundus descends about 1 cm daily and is not palpable by around 10–14 days.",
 "The other rates are too fast or too slow.",
 "Bumababa ang fundus nang mga 1 cm kada araw.","openrn");
NP2q('pp',1,"The most common cause of early postpartum hemorrhage is:",
 ["Uterine atony","Retained cotton","Infection","Hypertension"],
 "Uterine atony is the leading cause of early postpartum hemorrhage.",
 "The other options are less common causes.",
 "Pangunahing sanhi ay uterine atony.","openrn");
NP2q('pp',2,"An Rh-negative mother delivers an Rh-positive infant. Rh immune globulin should be given within:",
 ["72 hours","7 days","1 month","6 weeks"],
 "Rh immune globulin is given within 72 hours of birth to prevent sensitization.",
 "Later times are less effective.",
 "Ibigay ang Rh immune globulin sa loob ng 72 oras.","openrn");
NP2q('pp',2,"A mother is tearful on day 4 but eating and caring for the baby. Symptoms usually resolve within 2 weeks. This is most consistent with:",
 ["Postpartum blues","Postpartum depression","Postpartum psychosis","Bipolar disorder"],
 "Blues peak around days 3–5 and resolve within about 2 weeks without treatment.",
 "Depression and psychosis are more severe and persistent.",
 "Postpartum blues ang naglalaho sa loob ng 2 linggo.","openrn");
NP2q('pp',1,"To relieve breast engorgement in a breastfeeding mother, the nurse should advise:",
 ["Frequent feeding or expressing milk","Stopping breastfeeding","Tight binding only","Restricting fluids"],
 "Frequent emptying of the breasts relieves engorgement; warm compresses before and cold packs after feeding help.",
 "Stopping or binding worsens engorgement and risks mastitis.",
 "Madalas na pagpapasuso ang makakatulong.","who_bf");
NP2q('pp',2,"A mother with mastitis asks about breastfeeding. The nurse should advise:",
 ["Continue breastfeeding or expressing from the affected breast","Stop breastfeeding permanently","Wean abruptly","Avoid all fluids"],
 "Continued milk removal helps resolve mastitis; the milk is safe for the infant.",
 "Stopping milk flow worsens the condition.",
 "Ipagpatuloy ang pagpapasuso.","who_bf");
NP2q('pp',1,"For perineal pain after a vaginal delivery with episiotomy, the nurse applies ice packs during the first:",
 ["24 hours","1 week","6 weeks","48 hours only after sitz bath"],
 "Ice in the first 24 hours reduces swelling; warm sitz baths follow.",
 "Later times are not the period for ice.",
 "Yelo sa unang 24 oras.","openrn");
NP2q('pp',2,"Postpartum, the first sign of hypovolemia from hemorrhage is often:",
 ["Increased pulse rate","Decreased temperature","Elevated blood pressure","Increased urine output"],
 "Tachycardia is an early compensatory sign; hypotension appears late.",
 "Blood pressure falls late, and urine output decreases.",
 "Pagtaas ng pulso ang unang palatandaan.","openrn");
NP2q('nb',1,"The Apgar score is assessed at:",
 ["1 and 5 minutes after birth","10 and 20 minutes","30 minutes only","1 hour"],
 "Apgar is scored at 1 and 5 minutes (and again if low).",
 "The other times are not standard.",
 "Sinusuri ang Apgar sa 1 at 5 minuto.","openrn");
NP2q('nb',1,"Immediately after birth, the nurse dries the newborn thoroughly to prevent heat loss by:",
 ["Evaporation","Conduction","Convection","Radiation"],
 "Wet skin loses heat by evaporation; drying and covering prevent it.",
 "Conduction, convection and radiation are prevented by other measures.",
 "Pinipigilan ng pagpupunas ang evaporation.","doh");
NP2q('nb',1,"Vitamin K is given to the newborn to prevent:",
 ["Hemorrhagic disease of the newborn","Jaundice","Infection","Hypoglycemia"],
 "Newborns lack gut flora to make vitamin K; the injection prevents bleeding.",
 "The other conditions are not prevented by vitamin K.",
 "Pinipigilan ng vitamin K ang pagdurugo.","doh");
NP2q('nb',1,"Erythromycin ointment is applied to the newborn's eyes to prevent:",
 ["Ophthalmia neonatorum","Conjunctival bleeding","Glaucoma","Cataract"],
 "Prophylaxis prevents infection from maternal gonorrhea and chlamydia.",
 "The other options are not the purpose.",
 "Pinipigilan ang ophthalmia neonatorum.","doh");
NP2q('nb',2,"Which finding in a newborn requires immediate action?",
 ["Jaundice within the first 24 hours","Jaundice on day 3","Acrocyanosis","Milia"],
 "Jaundice in the first 24 hours is pathologic and needs evaluation.",
 "Jaundice on day 3, acrocyanosis and milia are common normal findings.",
 "Ang paninilaw sa unang 24 oras ay hindi normal.","openrn");
NP2q('nb',2,"Under essential newborn care (Unang Yakap), cord clamping is delayed for about:",
 ["1 to 3 minutes","10 seconds","10 minutes","30 minutes"],
 "DOH essential newborn care advises waiting 1–3 minutes, after drying and skin-to-skin contact.",
 "The other durations are not recommended.",
 "Ipagpaliban ang pagputol ng pusod nang 1–3 minuto.","doh");
NP2q('nb',1,"WHO recommends exclusive breastfeeding for the first:",
 ["6 months","2 months","4 months","12 months"],
 "Exclusive breastfeeding is recommended for the first 6 months, then complementary foods with continued breastfeeding.",
 "The other durations are not the recommendation.",
 "Eksklusibong pagpapasuso sa unang 6 na buwan.","who_bf");
NP2q('nb',2,"Which sign shows a good breastfeeding latch?",
 ["Wide-open mouth with chin touching the breast and lips flanged outward","Dimpled cheeks","Clicking sounds","Pain throughout the feed"],
 "A wide mouth, chin touching and flanged lips indicate effective latch.",
 "Dimpling, clicking and pain indicate poor latch.",
 "Malapad na bibig at nakadikit ang baba.","who_bf");
NP2q('nb',2,"Newborn screening is ideally collected:",
 ["After 24 hours of life","Before birth","Within 5 minutes of birth","At 1 month"],
 "Newborn screening is done after 24 hours of life (ideally 24–48 hours) so metabolic disorders can be detected.",
 "Earlier samples may give false results; later is too late.",

const TOPICS = [];
