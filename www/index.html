   T(id, area, title, summary, filipinoSummary, points[], memoryAid, table|null, svgKey, refIds[]) */
const TOPICS = [];
function T(id,a,title,sum,fil,pts,mn,tbl,svg,refs){ TOPICS.push({id,a,title,sum,fil,pts,mn,tbl,svg,refs}); }

/* ---- NP I ---- */
T('phc',1,'Primary health care and levels of prevention',
 'PHC brings essential, affordable care close to where people live, built on community participation, equity and intersectoral action.',
 'Ang primary health care ay abot-kayang pangunahing serbisyo na nakabatay sa pakikilahok ng komunidad, pagkakapantay-pantay at pagtutulungan ng mga sektor.',
 ['Principles: community participation, equity, intersectoral collaboration, appropriate technology, self-reliance.','Primary prevention stops disease before it occurs (immunization, health education, sanitation).','Secondary prevention finds disease early (screening, case finding, contact tracing).','Tertiary prevention limits disability and rehabilitates (physical therapy, support groups).','Health promotion empowers people to improve and control their health.'],
 'Primary = Prevent · Secondary = Screen · Tertiary = Rehabilitate',
 {h:['Level','Goal','Examples'],r:[['Primary','Prevent onset','Vaccines, handwashing campaigns, prenatal vitamins'],['Secondary','Early detection/treatment','TB contact screening, Pap smear, BP screening'],['Tertiary','Reduce disability','Stroke rehabilitation, diabetic foot care']]},'',['prc_tos','doh','openstax']);
T('epi',1,'Epidemiology, vital statistics and research basics',
 'Epidemiology describes the distribution and determinants of disease; the chosen measure and study design must match the question.',
 'Pinag-aaralan ng epidemiology ang pamamahagi at sanhi ng sakit; dapat angkop ang sukat at disenyo ng pag-aaral sa tanong.',
 ['Incidence counts new cases in a population at risk over time; prevalence counts all existing cases.','Endemic = usual presence; epidemic = excess over expected; pandemic = across countries.','Surveillance = ongoing collection, analysis and reporting of health data to guide action.','Randomized controlled trials give the strongest causal evidence; case reports and surveys give weaker evidence.','Research ethics: respect for persons, beneficence, justice; informed consent; confidentiality.'],
 'Incidence = NEW ÷ AT RISK · Prevalence = ALL ÷ TOTAL',
 {h:['Measure','Formula','Meaning'],r:[['Incidence rate','New cases ÷ population at risk × 1,000','Risk of new disease'],['Prevalence','All cases ÷ total population','Disease burden at a time'],['Case fatality rate','Deaths from disease ÷ cases × 100','Severity']]},'',['prc_tos','openstax']);
T('cd',1,'Communicable diseases: dengue, TB, leptospirosis, rabies',
 'Know the key clues, the first nursing priority and the community control measure for each priority infection.',
 'Alamin ang mga palatandaan, unang aksyon ng nars at hakbang ng komunidad sa bawat mahalagang impeksyon.',
 ['Dengue: warning signs (persistent vomiting, severe abdominal pain, mucosal bleeding, lethargy) around defervescence need urgent evaluation; avoid aspirin/NSAIDs; control by removing breeding sites.','TB: standard drug-susceptible regimen starts with four drugs; adherence (directly observed treatment) prevents resistance; rifampicin colors body fluids orange-red.','Leptospirosis: fever, calf pain, conjunctival suffusion after flood exposure; early treatment matters.','Rabies: wash wound with soap and running water ≥15 minutes, then seek post-exposure prophylaxis.'],
 'Dengue 4S: Search & destroy · Self-protection · Seek early consultation · Support fogging in outbreaks',
 {h:['Disease','Key clues','Nursing priority'],r:[['Dengue','Fever → warning signs at day 3–7','Monitor for plasma leakage; fluids; no NSAIDs'],['TB','Cough ≥2 weeks, night sweats, weight loss','Airborne precautions; adherence'],['Leptospirosis','Calf pain, red eyes, flood exposure','Report and refer promptly'],['Rabies','Animal bite/scratch','Wash wound; PEP']]},'',['who_dengue','who_tb','who_rabies','doh']);
T('imm',1,'Immunization and cold chain',
 'Safe immunization depends on correct schedule, storage at 2–8 °C, screening for true contraindications and clear client teaching.',
 'Ligtas ang pagbabakuna kung tama ang iskedyul, imbakan sa 2–8 °C at pagsusuri sa tunay na contraindication.',
 ['Store vaccines at 2–8 °C; protect freeze-sensitive vaccines; follow vial monitor and label instructions.','Mild illness without danger signs is not a contraindication.','Document vaccine, lot number, site and date; observe for adverse reactions.','BCG and hepatitis B are given early; others follow the DOH EPI schedule, which is updated periodically.'],
 'Cold chain: 2–8 — Don’t freeze, don’t bake',
 null,'',['doh']);
T('fam',1,'Family nursing, home visits and health education',
 'The family is the unit of care; plan visits, apply bag technique, and match teaching to the learner and domain of learning.',
 'Ang pamilya ang yunit ng pangangalaga; magplano ng pagbisita, gumamit ng bag technique at iangkop ang pagtuturo sa mag-aaral.',
 ['Bailon–Maglaya categories: wellness state, health threat, health deficit, foreseeable crisis.','Home visit: plan with a purpose, perform hand hygiene, use bag technique, document and plan the next visit.','Domains of learning: cognitive (knowing), affective (valuing), psychomotor (doing).','Return demonstration confirms psychomotor learning; teach-back confirms understanding.'],
 'Visit = Plan → Wash → Care → Record → Return',
 null,'',['openrn']);
T('prof',1,'Ethics, law, leadership, research and documentation',
 'Practice safely within law and ethics: obtain consent, protect privacy, delegate accountably, document accurately and use evidence.',
 'Magsanay nang ligtas ayon sa batas at etika: informed consent, privacy, tamang delegasyon, tumpak na dokumentasyon at ebidensya.',
 ['Core ethical principles: autonomy, beneficence, nonmaleficence, justice, fidelity, veracity, confidentiality.','Delegation: right task, circumstance, person, direction/communication and supervision; accountability stays with the delegating nurse.','Protect personal and health information (Data Privacy Act); avoid identifiable details on social media.','Documentation: factual, timely, signed, never alter or backdate; late entries are labeled.','SBAR (Situation, Background, Assessment, Recommendation) structures handoff and escalation.','Quality improvement (e.g., PDCA) and evidence-based practice improve outcomes.'],
 'Delegation 5 Rights: Task · Circumstance · Person · Direction · Supervision',
 null,'process',['ra9173','ra10173','openrn']);
T('ic',1,'Infection prevention and patient safety',
 'Break the chain of infection with hand hygiene, correct PPE use and transmission-based precautions.',
 'Putulin ang chain of infection gamit ang hand hygiene, tamang PPE at transmission-based precautions.',
 ['Chain of infection: agent → reservoir → portal of exit → mode of transmission → portal of entry → susceptible host.','Hand hygiene: alcohol rub when hands are not visibly soiled; soap and water when visibly soiled (and for some spore-forming organisms).','Gloves are removed first when doffing PPE; perform hand hygiene afterwards.','Use standard precautions with everyone; add contact, droplet or airborne precautions by route.','Safety: identify patients with two identifiers, prevent falls, and report incidents.'],
 'Airborne: TB, measles, varicella · Droplet: influenza, pertussis · Contact: MRSA, C. difficile',
 {h:['Precaution','Examples','Key measures'],r:[['Airborne','TB, measles, varicella','N95 respirator; negative-pressure room'],['Droplet','Influenza, pertussis','Surgical mask within close range'],['Contact','MRSA, C. difficile','Gown and gloves; dedicated equipment']]},'chain',['who_hh','cdc_sp','cdc_iso']);

/* ---- NP II ---- */
T('ante',2,'Antenatal care and fetal assessment',
 'Antenatal care tracks maternal and fetal well-being with dating, assessment and teaching about danger signs.',
 'Sinusubaybayan ng antenatal care ang kalusugan ng ina at sanggol gamit ang pagtatantya ng petsa, pagsusuri at pagtuturo ng danger signs.',
 ['Naegele’s rule: LMP − 3 months + 7 days.','GTPAL records gravida, term, preterm, abortions and living children.','Leopold’s maneuvers determine fetal lie, presentation and position.','Danger signs: vaginal bleeding, severe headache, visual changes, decreased fetal movement, fluid leakage, fever.','Teach nutrition, folic acid and iron per prenatal guidance, and avoidance of alcohol and smoking.'],
 'Naegele: −3 months, +7 days',
 null,'',['who_anc','ml_preg']);
T('labor',2,'Labor, delivery and fetal monitoring',
 'Support progress through the stages of labor and recognize fetal heart rate patterns that need action.',
 'Suportahan ang paglalabor sa bawat yugto at kilalanin ang mga pattern ng fetal heart rate na kailangang aksyunan.',
 ['Stage 1: onset of labor to full dilation (latent, active, transition). Stage 2: full dilation to birth. Stage 3: birth to placenta. Stage 4: early recovery.','Normal fetal heart rate baseline about 110–160/min.','Late decelerations signal uteroplacental insufficiency: stop oxytocin, reposition lateral, give oxygen per protocol, notify.','Transition: irritability, nausea and urge to push; coach breathing and stay present.'],
 'VEAL CHOP: Variable–Cord compression · Early–Head compression · Accelerations–OK · Late–Placental insufficiency',
 {h:['Pattern','Likely cause','Action'],r:[['Early deceleration','Head compression','Usually benign; observe'],['Variable deceleration','Cord compression','Reposition; notify if recurrent'],['Late deceleration','Placental insufficiency','Left lateral, stop oxytocin, O₂, notify']]},'labor',['ml_preg','openstax']);
T('pp',2,'Postpartum care',
 'Assess recovery systematically and recognize hemorrhage and infection early.',
 'Suriin nang sistematiko ang paggaling at maagang kilalanin ang pagdurugo at impeksyon.',
 ['BUBBLE-EE: Breasts, Uterus, Bladder, Bowels, Lochia, Episiotomy/perineum, Extremities (calf), Emotions.','Fundus should be firm and midline; a boggy fundus is massaged and a full bladder emptied.','Lochia: rubra (days 1–3) → serosa (about 4–10) → alba (after about 10).','Postpartum hemorrhage causes: Tone, Trauma, Tissue, Thrombin.','Screen for postpartum depression and support bonding.'],
 'BUBBLE-EE and the 4 Ts of PPH (Tone, Trauma, Tissue, Thrombin)',
 null,'',['ml_preg','openstax']);
T('nb',2,'Newborn care and breastfeeding',
 'Immediate care focuses on warmth, breathing, bonding and prophylaxis; breastfeeding is exclusive for the first six months.',
 'Pangunahing pangangalaga ang init, paghinga, bonding at prophylaxis; eksklusibong pagpapasuso hanggang anim na buwan.',
 ['Immediate care: dry thoroughly, skin-to-skin contact, delayed cord clamping for well babies.','Apgar: HR, respiratory effort, muscle tone, reflex irritability, color (0–2 each).','Vitamin K prevents bleeding; eye prophylaxis prevents ophthalmia; hepatitis B and BCG early.','Good latch, on-demand feeding and rooming-in support breastfeeding; Philippine law supports lactation in workplaces.'],
 'APGAR = Appearance (color) · Pulse · Grimace · Activity · Respiration',
 null,'fetal',['doh','who_bf','ra10028']);
T('comp',2,'High-risk pregnancy and complications',
 'Recognize bleeding and hypertensive disorders quickly and act on severe warning signs.',
 'Mabilis na kilalanin ang pagdurugo at hypertensive disorders at kumilos sa severe warning signs.',
 ['Preeclampsia: hypertension after 20 weeks with organ involvement; severe signs include headache, visual changes, epigastric pain.','Magnesium sulfate toxicity: absent reflexes, respiratory depression, oliguria; stop infusion and use calcium gluconate.','Gestational diabetes: screen at 24–28 weeks (earlier if high risk).','Ectopic pregnancy: pain, amenorrhea, shoulder pain and shock if ruptured.'],
 'Previa = Painless bright red · Abruptio = Agonizing, dark, rigid uterus',
 {h:['Condition','Bleeding','Pain'],r:[['Placenta previa','Bright red','Painless'],['Abruptio placentae','Dark/concealed','Painful, rigid uterus']]},'',['ml_preg']);
T('gd',2,'Growth and development',
 'Match teaching and expectations to developmental stage using Erikson and Piaget as frameworks.',
 'Iangkop ang pagtuturo at inaasahan sa yugto ng paglaki gamit ang Erikson at Piaget.',
 ['Infants: trust vs mistrust; sensorimotor. Toddlers: autonomy vs shame and doubt.','Preschoolers: initiative vs guilt; magical thinking in preoperational stage.','School-age: industry vs inferiority; concrete operations.','Adolescents: identity vs role confusion; abstract thinking.','Milestones vary—refer when markedly delayed.'],
 'Trust → Autonomy → Initiative → Industry → Identity',
 {h:['Age','Erikson','Piaget'],r:[['Infant','Trust vs mistrust','Sensorimotor'],['Toddler','Autonomy vs shame','Sensorimotor→Preoperational'],['Preschool','Initiative vs guilt','Preoperational'],['School-age','Industry vs inferiority','Concrete operational'],['Adolescent','Identity vs role confusion','Formal operational']]},'',['ml_ped','openstax']);
T('ped',2,'Child and adolescent health, IMCI and family planning',
 'Classify common childhood illness with IMCI-style danger signs and breathing rates; support adolescents and family planning choices.',
 'Uriin ang karaniwang sakit ng bata gamit ang danger signs at bilis ng paghinga; suportahan ang adolescents at family planning.',
 ['General danger signs: cannot drink/breastfeed, vomits everything, convulsions, lethargic or unconscious.','Fast breathing thresholds: ≥50/min at 2–11 months, ≥40/min at 12–59 months, ≥60/min under 2 months.','Diarrhea: ORS and zinc; watch for dehydration signs.','Puberty in girls begins with breast budding; boys with testicular enlargement.','LAM requires infant under 6 months, exclusive breastfeeding and no menses.'],
 'Danger signs: Drink · Vomit · Convulse · Lethargic',
 null,'',['who_peds','doh','ml_ped']);

/* ---- NP III ---- */
T('periop',3,'Perioperative nursing',
 'Safe surgery depends on consent, preparation, vigilant recovery monitoring and prevention of complications.',
 'Ligtas na operasyon: consent, paghahanda, mahigpit na pagsubaybay sa recovery at pag-iwas sa komplikasyon.',
 ['Preoperative: verify consent, NPO status, allergies, identification and site marking; teach deep breathing and leg exercises.','Intraoperative: surgical safety checklist (sign in, time out, sign out), asepsis, positioning, counts.','PACU priorities: airway, breathing, circulation, then pain, surgical site and temperature.','Complications: atelectasis, wound infection, dehiscence/evisceration (cover with moist sterile saline dressing, call surgeon), DVT.'],
 'Postop ABCs → Pain → Wound → Output',
 null,'',['openrn','openstax']);
T('resp',3,'Oxygenation and respiratory problems',
 'Match oxygen delivery to the client, interpret breath sounds and know emergency signs in asthma and COPD.',
 'Iangkop ang oxygen delivery sa kliyente, unawain ang breath sounds at kilalanin ang emergency signs.',
 ['Nasal cannula 1–6 L/min; simple mask about 6–10 L/min; non-rebreather 10–15 L/min; Venturi mask gives precise low-to-moderate FiO₂.','COPD with CO₂ retention: titrate oxygen to the ordered target (often SpO₂ 88–92%).','Severe asthma: a silent chest and drowsiness signal impending respiratory failure.','Chest drainage: tidaling is normal; continuous bubbling in water-seal chamber means air leak.'],
 'Silent chest = Sicker, not better',
 null,'',['gold','ml_resp','openstax']);
T('fe',3,'Fluids and electrolytes',
 'Know reference values and the typical signs of each imbalance; give potassium safely.',
 'Alamin ang normal na halaga at senyales ng bawat imbalance; ligtas na pagbibigay ng potassium.',
 ['Hyperkalemia: peaked T waves, weakness, arrhythmia. Hypokalemia: U waves, weakness, ileus.','Hypocalcemia: tingling, tetany, Chvostek/Trousseau signs. Hypercalcemia: weakness, constipation, short QT.','SIADH: water retention and low sodium → fluid restriction.','Never give potassium by IV push; dilute and use a pump.','Reference ranges vary by laboratory.'],
 'K+: “Peak T = high K” · “U wave = low K”',
 {h:['Electrolyte','Typical range','Low','High'],r:[['Sodium','135–145 mEq/L','Confusion, seizures','Thirst, agitation'],['Potassium','3.5–5.0 mEq/L','Weakness, U waves','Peaked T waves'],['Calcium','~8.5–10.5 mg/dL','Tetany, Chvostek+','Constipation, short QT'],['Magnesium','~1.3–2.1 mEq/L','Tremor, arrhythmia','Absent reflexes, low RR']]},'',['openstax']);
T('ab',3,'Acid–base balance and ABG interpretation',
 'Read pH first, then match PaCO₂ and HCO₃⁻ to find the primary disorder and compensation.',
 'Basahin muna ang pH, ihambing ang PaCO₂ at HCO₃⁻ upang matukoy ang pangunahing disorder at compensation.',
 ['Normal: pH 7.35–7.45, PaCO₂ 35–45 mm Hg, HCO₃⁻ 22–26 mEq/L.','ROME: Respiratory Opposite, Metabolic Equal.','Fully compensated: pH normal; partially compensated: pH abnormal and both PaCO₂ and HCO₃⁻ abnormal; uncompensated: pH and only one other abnormal.','DKA → metabolic acidosis with Kussmaul breathing; COPD retention → respiratory acidosis.'],
 'ROME',
 null,'acidbase',['openstax']);
T('inf',3,'Infection, HIV and immune responses',
 'Understand hypersensitivity types, emergency anaphylaxis care and exposure management.',
 'Unawain ang hypersensitivity, emergency care sa anaphylaxis at pamamahala sa exposure.',
 ['Anaphylaxis: IM epinephrine first, then airway support, fluids and adjuncts.','Type I immediate IgE; II cytotoxic; III immune complex; IV delayed (tuberculin test, contact dermatitis).','Needlestick: wash with soap and water, report immediately, assess for post-exposure prophylaxis.','TB: airborne precautions with N95 and negative-pressure room.'],
 'ACID: Anaphylactic (I) · Cytotoxic (II) · Immune complex (III) · Delayed (IV)',
 null,'',['ml_hiv','cdc_iso','openstax']);
T('onc',3,'Inflammation, wound healing, cancer care and blood therapy',
 'Support healing, protect immunocompromised clients and act fast in transfusion reactions.',
 'Suportahan ang paghilom, protektahan ang mahina ang resistensya at kumilos agad sa transfusion reaction.',
 ['Wound healing: inflammatory → proliferative → maturation; needs protein, vitamin C and zinc.','Chemotherapy: watch for neutropenia, bleeding, nausea; teach infection precautions and fever reporting.','Transfusion reaction: stop transfusion, keep line open with 0.9% saline using new tubing, check identity, notify provider/blood bank.','Cancer warning signs include unexplained weight loss, a lump, non-healing sore and persistent cough or hoarseness.'],
 'Transfusion reaction: STOP · Saline · Notify',
 null,'',['ml_cancer','openstax']);

/* ---- NP IV ---- */
T('nut',4,'Nutrition and diet therapy',
 'Link vitamin and mineral deficiencies to their classic clues and tailor therapeutic diets to the condition.',
 'Iugnay ang kakulangan sa bitamina at mineral sa klasikong senyales at iangkop ang therapeutic diet sa kondisyon.',
 ['Thiamine (B1): beriberi, Wernicke encephalopathy. Niacin (B3): pellagra. Vitamin C: scurvy. Vitamin D: rickets. Vitamin K: bleeding. Vitamin A: night blindness. B12: pernicious anemia. Folate: neural tube defects.','Vitamin C improves iron absorption; milk and antacids reduce it.','Celiac disease: avoid wheat, barley and rye.','CKD: individualized limits on sodium, potassium, phosphorus and fluid.','GERD: head elevation, avoid late meals, caffeine and large fatty meals.'],
 'Pellagra = 3 Ds: Dermatitis, Diarrhea, Dementia',
 {h:['Vitamin','Deficiency','Clue'],r:[['B1 thiamine','Beriberi / Wernicke','Neuropathy; confusion, ataxia'],['B3 niacin','Pellagra','Dermatitis, diarrhea, dementia'],['C','Scurvy','Bleeding gums, poor healing'],['D','Rickets/osteomalacia','Bone deformity'],['K','Coagulopathy','Easy bleeding']]},'',['who_diet','ml_gi']);
T('gi',4,'Gastrointestinal disorders',
 'Differentiate common GI conditions by pain pattern and stool findings, and avoid harmful interventions.',
 'Pag-iba-ibahin ang karaniwang GI na kondisyon ayon sa uri ng sakit at dumi, at iwasan ang mapanganib na gawain.',
 ['Gastric ulcer: pain soon after eating, weight loss. Duodenal ulcer: pain relieved by food, occurs hours later and at night.','Ulcerative colitis: continuous rectal-to-colon inflammation, bloody diarrhea. Crohn’s: skip lesions, transmural, fistulas.','Suspected appendicitis: NPO, no heat, no laxatives or enemas; sudden relief of pain may signal rupture.','GERD: lifestyle changes, PPIs per orders.'],
 'UC = Ulcers, Continuous, rectum, bloody · Crohn’s = skip, transmural, fistula',
 null,'',['ml_gi']);
T('hep',4,'Liver, biliary and pancreatic disorders',
 'Know how hepatitis spreads, why ammonia matters, and the key signs of pancreatitis and cholecystitis.',
 'Alamin ang paraan ng pagkalat ng hepatitis, kahalagahan ng ammonia at senyales ng pancreatitis at cholecystitis.',
 ['Hepatitis A and E: fecal–oral. Hepatitis B, C, D: blood and body fluids.','Hepatic encephalopathy: lactulose lowers ammonia; watch for asterixis and confusion.','Pancreatitis: epigastric pain radiating to back, raised lipase; NPO and pain control.','Cholecystitis: RUQ pain, fever, positive Murphy’s sign; low-fat diet after recovery.'],
 'A & E = Enteric · B, C, D = Blood',
 {h:['Hepatitis','Route','Prevention'],r:[['A','Fecal–oral','Vaccine, handwashing, safe water'],['B','Blood, sexual, perinatal','Vaccine, safe sex, no sharing needles'],['C','Blood','Safe injection, screening']]},'',['ml_gi']);
T('dm',4,'Diabetes mellitus and insulin',
 'Treat hypoglycemia fast, mix insulin correctly and recognize DKA early.',
 'Gamutin agad ang hypoglycemia, tamang paghahalo ng insulin at maagang pagkilala sa DKA.',
 ['Hypoglycemia (sweating, shaking, confusion): give about 15 g fast-acting carbohydrate and recheck in 15 minutes; severe or unconscious needs glucagon/IV dextrose per protocol.','Mixing insulin: clear (regular) before cloudy (NPH).','DKA: hyperglycemia, ketones, Kussmaul breathing, fruity breath; start isotonic fluids, then insulin with potassium monitoring.','Sick-day rules: never omit basal insulin; monitor glucose and ketones frequently.'],
 'Clear before Cloudy · Rule of 15',
 {h:['Feature','DKA','HHS'],r:[['Typical type','Type 1','Type 2, older adults'],['Glucose','Often 250–600 mg/dL','Often >600 mg/dL'],['Ketones','Present, acidosis','Minimal'],['Key issue','Acidosis, dehydration','Severe dehydration, altered mental status']]},'insulin',['ada','ml_dm']);
T('endo',4,'Thyroid and adrenal disorders',
 'Recognize hypo/hyperfunction patterns and treat adrenal crisis as an emergency.',
 'Kilalanin ang hypo/hyperfunction at ituring na emergency ang adrenal crisis.',
 ['Hypothyroidism: cold intolerance, weight gain, bradycardia, fatigue; levothyroxine on an empty stomach.','Hyperthyroidism: heat intolerance, weight loss, tachycardia, tremor; thyroid storm is an emergency.','Cushing’s: moon face, buffalo hump, hyperglycemia. Addison’s: weakness, hypotension, hyponatremia, hyperkalemia.','After thyroidectomy watch airway, bleeding and hypocalcemia (tingling, Chvostek).'],
 'Hypo = slow/cold · Hyper = fast/hot',
 null,'',['ml_thy']);
T('sens',4,'Sensory (perception) disorders: eye and ear',
 'Prioritize sight-threatening emergencies and use correct technique for eye and ear medications.',
 'Unahin ang mga emergency na nagbabanta sa paningin at gamitin ang tamang teknik sa gamot sa mata at tainga.',
 ['Acute angle-closure glaucoma: sudden severe eye pain, halos, nausea → emergency.','Open-angle glaucoma: gradual peripheral vision loss, often painless.','Cataract surgery teaching: avoid heavy lifting, bending and rubbing the eye; use shield as instructed.','Ear drops: adults pull pinna up and back; children under 3 down and back.'],
 'Adult: up and back · Child: down and back',
 null,'',['ml_eye']);
T('neuro',4,'Neurologic and coordination problems',
 'Recognize raised intracranial pressure and stroke early, and protect the airway and safety.',
 'Maagang kilalanin ang tumaas na ICP at stroke, at protektahan ang daanan ng hangin at kaligtasan.',
 ['Early ↑ICP: restlessness, headache, changes in level of consciousness. Late: Cushing’s triad (hypertension with widened pulse pressure, bradycardia, irregular respirations).','Raise head of bed about 30° and keep neck neutral unless ordered otherwise.','Stroke: FAST (Face, Arm, Speech, Time); establish last known well time immediately.','Glasgow Coma Scale ranges 3–15 (eye 4, verbal 5, motor 6).','Seizure: protect from injury, note time and features, never restrain or put objects in the mouth.'],
 'FAST: Face · Arm · Speech · Time',
 null,'',['ml_neuro','openstax']);

/* ---- NP V ---- */
T('mh',5,'Mental health nursing and therapeutic communication',
 'Use therapeutic techniques, ask directly about suicide, and apply the least restrictive safe intervention.',
 'Gumamit ng therapeutic communication, direktang magtanong tungkol sa pagpapakamatay, at ng pinakamaluwag na ligtas na interbensyon.',
 ['Therapeutic: active listening, open-ended questions, reflection, silence, clarification.','Non-therapeutic: false reassurance, giving advice, asking “why”, changing the subject.','Delusions: do not argue or agree; acknowledge feelings, present reality.','Suicide risk: ask directly about thoughts and plan, stay with the client, follow facility protocol.','Alcohol withdrawal: tremor in hours; delirium tremens at roughly 48–96 hours is an emergency.','Restraint: last resort with order, monitoring and documentation per policy.'],
 'Therapeutic: Listen · Reflect · Clarify · Silence',
 null,'',['who_mhgap','ml_mh']);
T('drug',5,'Psychotropic drugs and safety',
 'Know the key teaching and the emergencies linked to common psychotropic drugs.',
 'Alamin ang pangunahing pagtuturo at emergency na kaugnay ng karaniwang psychotropic na gamot.',
 ['Antipsychotics: acute dystonia (treat with anticholinergic), tardive dyskinesia (long-term), neuroleptic malignant syndrome (fever, rigidity — emergency).','Lithium: maintain consistent sodium and fluids; monitor levels; toxicity includes coarse tremor, vomiting, confusion.','MAOIs: avoid tyramine-rich foods (aged cheese, cured meats).','SSRIs: take weeks for full effect; avoid abrupt stopping; watch for serotonin syndrome and early suicidal thoughts in young people.'],
 'NMS = FEVER: Fever, Encephalopathy, Vitals unstable, Elevated CK, Rigidity',
 {h:['Drug class','Example','Key teaching'],r:[['Antipsychotic','Haloperidol','Report muscle spasms, fever, rigidity'],['Mood stabilizer','Lithium','Steady salt/fluids; blood levels'],['MAOI','Phenelzine','Avoid tyramine'],['SSRI','Fluoxetine','Weeks to work; do not stop abruptly']]},'',['ml_mh']);
T('card',5,'Cardiac emergencies, heart failure and CPR',
 'Respond fast to chest pain and cardiac arrest with high-quality CPR and early defibrillation.',
 'Kumilos agad sa chest pain at cardiac arrest gamit ang de-kalidad na CPR at maagang defibrillation.',
 ['Suspected MI: stop activity, call for help, obtain ECG, oxygen if hypoxic, aspirin unless contraindicated, per protocol.','Left heart failure: crackles, orthopnea, pulmonary edema → high Fowler’s, diuretics. Right heart failure: edema, JVD, weight gain.','CPR: 100–120 compressions/min, ≥5 cm depth, full recoil, minimal pauses.','VF or pulseless VT: CPR and defibrillation as soon as available.'],
 'Left = Lungs · Right = Rest of body',
 {h:['','Left HF','Right HF'],r:[['Congestion in','Lungs','Systemic veins'],['Signs','Crackles, orthopnea, frothy sputum','Edema, JVD, hepatomegaly']]},'heart',['aha','ml_heart','ml_hf']);
T('shock',5,'Shock and sepsis',
 'Recognize shock by perfusion signs and begin time-critical sepsis care.',
 'Kilalanin ang shock sa palatandaan ng perfusion at simulan ang agarang pangangalaga sa sepsis.',
 ['Hypovolemic: tachycardia, hypotension, cool skin. Septic: fever, tachycardia, warm then cold skin, raised lactate. Anaphylactic: airway swelling, hives. Cardiogenic: pump failure.','Sepsis: blood cultures, prompt antimicrobials, IV crystalloid resuscitation, vasopressors if needed, per current guidelines.','Reassess perfusion: mental status, urine output, capillary refill, lactate.'],
 'Sepsis: Cultures · Antibiotics · Fluids · Lactate',
 null,'',['ssc']);
T('renal',5,'Acute kidney injury and renal replacement',
 'Know AKI phases and the complications to monitor in each.',
 'Alamin ang yugto ng AKI at mga komplikasyon na dapat bantayan.',
 ['Phases: onset, oliguric, diuretic, recovery.','Oliguric phase: monitor for hyperkalemia, fluid overload and uremia.','Diuretic phase: watch for dehydration and hypokalemia.','Dialysis access: protect the fistula arm—no BP or venipuncture; check for thrill and bruit.'],
 'Oliguric = Overload and high K · Diuretic = Dry and low K',
 null,'',['ml_kidney']);
T('burn',5,'Burns',
 'Prioritize airway, estimate burn size, and resuscitate with fluids titrated to urine output.',
 'Unahin ang daanan ng hangin, tantyahin ang laki ng paso at magbigay ng fluids ayon sa ihi.',
 ['Inhalation injury clues: singed nasal hair, hoarseness, soot in sputum, facial burns.','Rule of nines estimates adult TBSA; children need pediatric charts.','Parkland formula: 4 mL × kg × %TBSA over 24 h, half in the first 8 h from the time of burn; titrate to urine output.','Cool minor burns with running water, cover with clean dressing; do not apply ice or butter.'],
 'Parkland: 4 × kg × %TBSA — half in first 8 h',
 null,'nines',['ml_burn']);
T('em',5,'Emergencies, triage, poisoning and high-acuity care',
 'Prioritize with ABCs and triage systems, know common antidotes, and use ventilator bundles.',
 'Magpriyoridad gamit ang ABC at triage, alamin ang karaniwang antidote at ventilator bundle.',
 ['START triage: walking = minor (green); RR >30 = immediate (red); no breathing after airway opened = expectant/deceased; cannot follow commands or absent radial pulse = immediate.','Acetaminophen overdose: N-acetylcysteine. Opioid overdose: naloxone (watch for re-sedation). Benzodiazepine overdose: flumazenil (caution). Organophosphate: atropine and pralidoxime.','Ventilator bundle: head of bed 30–45°, oral care, sedation interruption, subglottic suction as available.','Always reassess ABCDE (Airway, Breathing, Circulation, Disability, Exposure).'],
 'Antidotes: Acetaminophen–NAC · Opioid–Naloxone · Benzodiazepine–Flumazenil · Warfarin–Vitamin K',
 {h:['Poison','Antidote'],r:[['Acetaminophen','N-acetylcysteine'],['Opioids','Naloxone'],['Benzodiazepines','Flumazenil (use with caution)'],['Warfarin','Vitamin K'],['Heparin','Protamine sulfate']]},'cpr',['ml_poison','aha','openstax']);

function sb(x,y,w,h,txt,cls){cls=cls||'';const L=txt.split('|');const dark=/sv-(ox|dx)/.test(cls);const y0=y-(L.length-1)*8+4;
 return `<rect class="sv-b ${cls}" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="8"/><text class="${dark?'sv-td':'sv-t'}" x="${x}" y="${y0}" text-anchor="middle">${L.map((s,i)=>`<tspan x="${x}" dy="${i?16:0}">${s}</tspan>`).join('')}</text>`;}
function ar(x1,y1,x2,y2){return `<line class="sv-l" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#ah)"/>`;}
function lb(x,y,t,anchor){return `<text class="sv-s" x="${x}" y="${y}" text-anchor="${anchor||'middle'}">${t}</text>`;}

/* ---------- colour helpers ---------- */
const hex2rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255]};
const rgb2hex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const lum=h=>{const [r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const mix=(a,b,t)=>{const x=hex2rgb(a),y=hex2rgb(b);return rgb2hex(x.map((v,i)=>v+(y[i]-v)*t))};
function ensure(fg,bg,min){min=min||4.5;let c=fg,i=0;const target=lum(bg)>.4?'#000000':'#ffffff';while(contrast(c,bg)<min&&i<40){c=mix(c,target,.08);i++}return c}
const onColor=bg=>contrast('#ffffff',bg)>=contrast('#111111',bg)?'#ffffff':'#111111';

const store={ls:true,idb:false,mem:{kv:{},img:{}},warned:{},db:null};
function warnOnce(key,msg){ if(store.warned[key])return; store.warned[key]=1; toast(msg,'bad',8000); }

};
function idbOpen(){return new Promise((res,rej)=>{
 if(!('indexedDB' in window)){rej(new Error('IndexedDB unavailable'));return}
 let r;try{r=indexedDB.open('pnle-study-hub',1)}catch(e){rej(e);return}
 r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv',{keyPath:'key'});if(!d.objectStoreNames.contains('images'))d.createObjectStore('images',{keyPath:'id'})};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('IndexedDB error'));r.onblocked=()=>rej(new Error('IndexedDB blocked'));})}
function tx(storeName,mode,fn){return new Promise((res,rej)=>{try{const t=store.db.transaction(storeName,mode);const s=t.objectStore(storeName);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Transaction aborted'))}catch(e){rej(e)}})}
const DB={
 async init(){try{store.db=await idbOpen();store.idb=true}catch(e){store.idb=false;store.dbErr=e&&e.message}},
 async get(key,def){if(!store.idb)return key in store.mem.kv?store.mem.kv[key]:def;try{const r=await tx('kv','readonly',s=>s.get(key));return r?r.value:def}catch(e){return def}},
 async set(key,value){store.mem.kv[key]=value;if(!store.idb)return false;try{await tx('kv','readwrite',s=>s.put({key,value}));return true}catch(e){warnOnce('idbset','The browser could not save “'+key+'” to device storage ('+(e&&e.name||'error')+'). It may be full or blocked. Export a backup from Settings.');return false}},
 async putImage(rec){store.mem.img[rec.id]=rec;if(!store.idb)return false;try{await tx('images','readwrite',s=>s.put(rec));return true}catch(e){warnOnce('idbimg','The browser could not save an uploaded image (storage may be full). The steps are saved as text; the original photo was not kept.');return false}},
 async getImage(id){if(!store.idb)return store.mem.img[id]||null;try{return await tx('images','readonly',s=>s.get(id))||store.mem.img[id]||null}catch(e){return store.mem.img[id]||null}},
 async delImage(id){delete store.mem.img[id];if(!store.idb)return;try{await tx('images','readwrite',s=>s.delete(id))}catch(e){}},
 async allImages(){if(!store.idb)return Object.values(store.mem.img);try{return await tx('images','readonly',s=>s.getAll())||[]}catch(e){return Object.values(store.mem.img)}},
 async clearAll(){store.mem={kv:{},img:{}};if(!store.idb)return;try{await tx('kv','readwrite',s=>s.clear());await tx('images','readwrite',s=>s.clear())}catch(e){}}

/* ---------- pools & sessions ---------- */
function poolFor(f){return QS.filter(q=>{
 if(f.areas&&f.areas.length&&!f.areas.includes(q.a))return false;
 if(f.topic&&q.t!==f.topic)return false;
 if(f.diffs&&f.diffs.length&&!f.diffs.includes(q.d))return false;
 const s=S.seen[q.id];
 if(f.source==='unseen'&&s)return false;
 if(f.source==='missed'&&!(s&&s.last===false))return false;
 if(f.source==='saved'&&!S.saved.includes(q.id))return false;
 return true})}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

 S.session={id:uid(),mode:o.mode,qids:o.qids,ans:{},flags:{},cur:0,elapsed:0,limit:o.limit||null,started:Date.now(),done:false};
 await persist('session');go('#/quiz');
}

function drawResize(src,max){const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight,k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);return c}
async function loadBitmap(file){if('createImageBitmap' in window){try{return await createImageBitmap(file)}catch(e){}}

let tessPromise=null;
function loadTesseract(){if(window.Tesseract)return Promise.resolve();if(tessPromise)return tessPromise;
 tessPromise=new Promise((res,rej)=>{const s=document.createElement('script');s.src=OCR_URL;s.async=true;s.crossOrigin='anonymous';const to=setTimeout(()=>{rej(new Error('timeout'))},25000);
  s.onload=()=>{clearTimeout(to);window.Tesseract?res():rej(new Error('Library did not initialize'))};s.onerror=()=>{clearTimeout(to);rej(new Error('Script failed to load'))};document.head.appendChild(s)});

async function runOCR(items){
 if(DRAFT.ocrBusy)return;DRAFT.ocrBusy=true;items.forEach(i=>{i.status='loading';i.err='';i.pct=0});renderDraft();
 let worker=null;
 try{await loadTesseract()}catch(e){items.forEach(i=>{i.status='error';i.err=OCR_FAIL});DRAFT.ocrBusy=false;renderDraft();return}
 let cur=null;
 try{worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(!cur)return;if(m.status==='recognizing text'){cur.pct=Math.round(m.progress*100);const b=$('#pgi-'+cur.id);if(b)b.style.width=cur.pct+'%';const tt=$('#pgt-'+cur.id);if(tt)tt.textContent=cur.pct+'%'}}})}
 catch(e){items.forEach(i=>{i.status='error';i.err=OCR_FAIL+' ('+(e&&e.message||'worker error')+')'});DRAFT.ocrBusy=false;renderDraft();return}
 for(const it of items){cur=it;it.status='reading';renderDraft();
  try{const bm=await loadBitmap(it.file);const c=drawResize(bm,2200);const {data}=await worker.recognize(c);
   it.lines=(data.lines||[]).map(l=>({t:(l.text||'').replace(/\s+/g,' ').trim(),c:l.confidence})).filter(l=>l.t);
   it.text=it.lines.length?it.lines.map(l=>l.t).join('\n'):(data.text||'').trim();

   else{it.status='done';it.pct=100}}

 try{await worker.terminate()}catch(e){}
 DRAFT.ocrBusy=false;renderDraft();
}

function parseSteps(items){
 const out=[],warn=[];const numRe=/^\s*(?:step\s*)?(\d{1,2})\s*[\.\):\-]\s+(.*)$/i,bulRe=/^\s*[-•*·▪●]\s+(.*)$/;
 const lines=[];items.forEach(it=>{const low=new Set((it.lines||[]).filter(l=>l.c<70).map(l=>l.t));String(it.text||'').split(/\r?\n/).forEach(raw=>{const s=raw.replace(/\s+/g,' ').trim();if(s)lines.push({s,unsure:low.has(s)})})});
 const numbered=lines.filter(l=>numRe.test(l.s)).length;let nums=[];
 if(numbered>=2){let curS=null;lines.forEach(l=>{const m=l.s.match(numRe);if(m){curS={id:uid(),text:m[2].trim(),unsure:l.unsure};nums.push(+m[1]);out.push(curS)}else if(curS){curS.text+=' '+l.s;curS.unsure=curS.unsure||l.unsure}else{out.push({id:uid(),text:l.s,unsure:true})}});
  for(let i=1;i<nums.length;i++){if(nums[i]!==nums[i-1]+1)warn.push(t('Numbering jumps from '+nums[i-1]+' to '+nums[i]+' — a step may be missing or misread. Check your photo and add it if needed.','Tumalon ang bilang mula '+nums[i-1]+' patungong '+nums[i]+' — may hakbang na maaaring nawawala. Tingnan ang larawan at idagdag kung kailangan.'))}}
 else lines.forEach(l=>{const m=l.s.match(bulRe);out.push({id:uid(),text:(m?m[1]:l.s).trim(),unsure:l.unsure})});
 out.forEach(s=>{if(s.text.length<4)s.unsure=true});
 return {steps:out,warn};
}

 DRAFT.steps=steps;DRAFT.warnings=warn;DRAFT.stage='edit';renderDraft()};

 if(f.setting&&c.setting!==f.setting)return false;if(f.role&&c.role!==f.role)return false;
 if(f.skill&&!skillsOf(c).map(s=>s.toLowerCase()).includes(f.skill))return false;
 if(f.from&&c.date<f.from)return false;if(f.to&&c.date>f.to)return false;
 if(q&&![c.title,c.setting,c.role,c.skills,c.reflection,c.lessons,c.notes].join(' ').toLowerCase().includes(q))return false;return true}).sort((a,b)=>b.date.localeCompare(a.date)||b.updated-a.updated)}

 if(!S.cases.length)return `<div class="empty">${ic('clip')}<p>${t('No cases recorded yet. Log the cases and procedures you complete to track your learning.','Wala pang naitalang kaso. I-log ang mga kasong natapos mo para masubaybayan ang iyong pagkatuto.')}</p><button class="btn" data-act="addcase">${ic('plus')}${t('Add your first case','Idagdag ang unang kaso')}</button></div>`;

 ${skillsOf(c).length?`<p style="margin:.4rem 0">${skillsOf(c).map(s=>`<span class="chip">${esc(s)}</span>`).join(' ')}</p>`:''}
 ${c.reflection?`<p><b>${t('Reflection','Repleksyon')}:</b> ${esc(c.reflection)}</p>`:''}${c.lessons?`<p><b>${t('Lessons learned','Mga natutunan')}:</b> ${esc(c.lessons)}</p>`:''}${c.notes?`<details><summary>${t('Private notes','Pribadong tala')}</summary><div class="inner">${esc(c.notes)}</div></details>`:''}</article>`).join('')}

 $('#main').innerHTML=`<h1>${t('Case accomplishment notes','Talaan ng natapos na kaso')}</h1><p class="muted">${t('A private log of cases and procedures you have completed. Stored only on this device.','Pribadong talaan ng mga kaso at prosedurang natapos mo. Nasa device na ito lamang.')}</p>${privacyNotice()}
 <div class="row" style="margin:.8rem 0"><button class="btn" data-act="addcase">${ic('plus')}${t('Add case','Magdagdag ng kaso')}</button><button class="btn sec" data-act="expcases" data-arg="csv" ${S.cases.length?'':'disabled'}>${ic('down')}${t('Export CSV','I-export ang CSV')}</button><button class="btn sec" data-act="expcases" data-arg="json" ${S.cases.length?'':'disabled'}>${ic('down')}${t('Export JSON','I-export ang JSON')}</button></div>

 <div class="sect"><h2>${t('Language','Wika')}</h2><p class="muted small">${t('Applies to the interface and to study content that has a Filipino version (reviewer summaries and rationales). Clinical terms and exam question stems stay in English because the PNLE is given in English.','Para sa interface at nilalamang may bersyong Filipino (buod sa reviewer at rationale). Nananatiling English ang mga terminong klinikal at tanong dahil English ang PNLE.')}</p>
  <div class="seg" role="radiogroup" aria-label="${t('Language','Wika')}">${[['en','English'],['fil','Filipino'],['mix',t('Mixed (English + Filipino)','Halo (English + Filipino)')]].map(([v,l])=>`<label><input type="radio" name="lang" value="${v}" ${P.lang===v?'checked':''} data-chg="lang"><span>${l}</span></label>`).join('')}</div></div>
 <div class="sect"><h2>${t('Appearance','Hitsura')}</h2>
  <div class="stack"><div><div class="f" id="th-l">${t('Light / dark','Maliwanag / madilim')}</div><div class="seg" role="radiogroup" aria-labelledby="th-l">${[['auto',t('Match device','Ayon sa device')],['light',t('Light','Maliwanag')],['dark',t('Dark','Madilim')]].map(([v,l])=>`<label><input type="radio" name="theme" value="${v}" ${P.theme===v?'checked':''} data-chg="theme"><span>${l}</span></label>`).join('')}</div></div>
  <div><div class="f">${t('Accent color presets','Mga preset ng accent')}</div><div class="row" id="accent-presets">${sw(ACCENTS,P.accent,'accentpreset')}</div><div class="row" style="margin-top:.5rem"><label class="f" for="accent-custom" style="margin:0">${t('Custom accent','Sariling accent')}</label><input id="accent-custom" type="color" value="${P.accent}" data-inp="accentcustom"></div></div>
  <div><div class="f">${t('Background presets','Mga preset ng background')}</div><div class="row" id="bg-presets">${sw(BGS,P.bg,'bgpreset')}<button class="sw" data-act="bgdefault" aria-pressed="${!P.bg}"><i style="background:linear-gradient(90deg,#f3f7f6 50%,#12181d 50%)"></i>${t('Default for theme','Default ng theme')}</button></div><div class="row" style="margin-top:.5rem"><label class="f" for="bg-custom" style="margin:0">${t('Custom background','Sariling background')}</label><input id="bg-custom" type="color" value="${themeVars(P).bg}" data-inp="bgcustom"></div></div>
  <div><label class="f" for="size">${t('Text size','Laki ng teksto')}: <span id="size-v">${P.size}%</span></label><input id="size" type="range" min="85" max="140" step="5" value="${P.size}" data-inp="size"></div>
  <div class="row"><button class="btn ghost" data-act="resetappearance">${t('Reset appearance to default','I-reset ang hitsura')}</button></div>
  <div class="preview" aria-label="${t('Live preview','Live preview')}"><h3>${t('Preview','Preview')}</h3><p>${t('Body text looks like this, with an','Ganito ang itsura ng teksto, may')} <a href="#/settings" onclick="return false">${t('accent link','accent link')}</a>.</p><div class="row"><button class="btn" type="button">${t('Primary button','Pangunahing button')}</button><button class="btn sec" type="button">${t('Secondary','Pangalawa')}</button><span class="chip ok">${t('Correct','Tama')}</span><span class="chip warn">${t('Flagged','Naka-flag')}</span><span class="chip bad">${t('Missed','Mali')}</span></div></div>
  <div id="contrast">${contrastHTML()}</div></div></div>
 <div class="sect"><h2>${t('Your data on this device','Iyong data sa device na ito')}</h2>
  <div class="notice info" role="note">${ic('info')}<div>${t('Notes, case log, saved questions, quiz progress, preferences and return-demonstration step sets (including photos) are stored only in this browser on this device (IndexedDB and localStorage). They do not sync automatically and are not uploaded anywhere. Clearing browser data, using private browsing, or switching browser or device will remove or hide them — export a backup regularly.','Ang mga tala, case log, naka-save na tanong, progreso, setting at return-demo step sets (kasama ang larawan) ay nasa browser at device na ito lamang (IndexedDB at localStorage). Hindi ito nagsi-sync at hindi ina-upload. Mawawala ang mga ito kapag nilinis ang browser data, private browsing, o lumipat ng browser/device — mag-export ng backup nang madalas.')}</div></div>
  <p class="small" id="storstat">${t('Checking storage…','Sinusuri ang storage…')}</p>
  <div class="stack"><div class="panel"><h3>${t('Export backup','I-export ang backup')}</h3><label class="chk"><input type="checkbox" id="incimg" checked> ${t('Include saved photos (larger file)','Isama ang mga naka-save na larawan (mas malaking file)')}</label><button class="btn" data-act="exportdata">${ic('down')}${t('Download backup (.json)','I-download ang backup (.json)')}</button></div>
  <div class="panel"><h3>${t('Import backup','I-import ang backup')}</h3><label class="f" for="impfile">${t('Choose a backup file made by this app','Pumili ng backup file mula sa app na ito')}</label><input id="impfile" type="file" accept=".json,application/json" data-chg="importfile"></div>
  <div class="panel"><h3>${t('Clear data','Burahin ang data')}</h3><p class="small muted">${t('Deletes your saved data from this browser. Export a backup first if you may want it later.','Buburahin ang iyong naka-save na data sa browser na ito. Mag-export muna ng backup kung kakailanganin mo pa.')}</p><button class="btn danger" data-act="cleardata">${ic('trash')}${t('Clear data…','Burahin ang data…')}</button></div></div></div>
 <div class="sect"><h2>${t('About this app','Tungkol sa app')}</h2><p class="small">${t('PNLE Study Hub is unofficial self-study material. It is not produced, endorsed or reviewed by the PRC or the Board of Nursing, contains no actual PRC examination questions, and cannot promise complete coverage or any exam result. See','Ang PNLE Study Hub ay hindi opisyal na materyal sa pag-aaral. Hindi ito gawa, aprubado o sinuri ng PRC o Board of Nursing, walang aktwal na tanong ng PRC, at hindi makapangangako ng kumpletong saklaw o resulta. Tingnan ang')} <a href="#/refs">${t('References','Mga sanggunian')}</a>.</p></div>`;
 storageStatus();
}
async function storageStatus(){let est='';try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();est=' '+t('Approx. used','Tinatayang gamit')+': '+(e.usage/1048576).toFixed(1)+' MB '+t('of','sa')+' ~'+Math.round(e.quota/1048576)+' MB.'}}catch(e){}
 const el=$('#storstat');if(el)el.innerHTML=`${t('Large records & photos (IndexedDB)','Malalaking record at larawan (IndexedDB)')}: <b>${store.idb?t('available','available'):t('unavailable — kept in memory only','hindi available — nasa memorya lamang')}</b> · ${t('Preferences (localStorage)','Preferences (localStorage)')}: <b>${store.ls?t('available','available'):t('unavailable','hindi available')}</b>.${est}`}
CHG.lang=el=>{P.lang=el.value;savePrefs();renderShell();ROUTE_NOFOCUS=true;vSettings();toast(t('Language saved','Na-save ang wika'))};
CHG.theme=el=>{P.theme=el.value;P.bg=null;savePrefs();applyTheme();ROUTE_NOFOCUS=true;vSettings();toast(t('Appearance updated (background reset to match)','Na-update ang hitsura (nag-reset ang background)'))};
ACT.accentpreset=el=>{P.accent=el.dataset.arg;savePrefs();applyTheme();ROUTE_NOFOCUS=true;vSettings();const b=$('#accent-presets [aria-pressed=true]');b&&b.focus()};
ACT.bgpreset=el=>{P.bg=el.dataset.arg;savePrefs();applyTheme();ROUTE_NOFOCUS=true;vSettings();const b=$('#bg-presets [aria-pressed=true]');b&&b.focus()};
ACT.bgdefault=()=>{P.bg=null;savePrefs();applyTheme();ROUTE_NOFOCUS=true;vSettings()};
INP.accentcustom=el=>{P.accent=el.value;savePrefs();applyTheme();$('#contrast').innerHTML=contrastHTML();$$('#accent-presets .sw').forEach(b=>b.setAttribute('aria-pressed','false'))};
INP.bgcustom=el=>{P.bg=el.value;savePrefs();applyTheme();$('#contrast').innerHTML=contrastHTML();$$('#bg-presets .sw').forEach(b=>b.setAttribute('aria-pressed','false'))};
INP.size=el=>{P.size=+el.value;savePrefs();applyTheme();$('#size-v').textContent=P.size+'%'};
ACT.resetappearance=()=>{P.theme=DEFAULT_PREFS.theme;P.accent=DEFAULT_PREFS.accent;P.bg=null;P.size=100;savePrefs();applyTheme();ROUTE_NOFOCUS=true;vSettings();toast(t('Appearance reset to default','Na-reset ang hitsura'))};

/* ---- backup ---- */
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
function dataURLToBlob(u){const [h,b]=u.split(',');const mime=(h.match(/:(.*?);/)||[])[1]||'application/octet-stream';const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
ACT.exportdata=async()=>{try{const out={app:'pnle-study-hub',version:1,exported:new Date().toISOString(),note:'Unofficial study app backup. Contains only data saved in this browser.',prefs:P,data:{cases:S.cases,procs:S.procs,notes:S.notes,saved:S.saved,history:S.history,seen:S.seen,last:S.last,session:S.session},images:[]};
 if($('#incimg').checked){for(const r of await DB.allImages()){if(r&&r.blob)out.images.push({id:r.id,procId:r.procId,name:r.name,type:r.type,dataUrl:await blobToDataURL(r.blob)})}}
 download('pnle-study-hub-backup-'+today()+'.json','application/json',JSON.stringify(out));toast(t('Backup downloaded. Keep it somewhere safe.','Na-download ang backup. Itago sa ligtas na lugar.'))}catch(e){toast(t('Could not create the backup: ','Hindi nagawa ang backup: ')+e.message,'bad',7000)}};
CHG.importfile=async el=>{const f=el.files&&el.files[0];if(!f)return;let obj;
 try{obj=JSON.parse(await f.text());if(!obj||obj.app!=='pnle-study-hub'||!obj.data||typeof obj.data!=='object')throw new Error('This is not a PNLE Study Hub backup file.');
  for(const k of ['cases','procs','saved','history'])if(obj.data[k]!==undefined&&!Array.isArray(obj.data[k]))throw new Error('Backup field “'+k+'” is not valid.');
  for(const k of ['notes','seen'])if(obj.data[k]!==undefined&&(typeof obj.data[k]!=='object'||Array.isArray(obj.data[k])))throw new Error('Backup field “'+k+'” is not valid.')}
 catch(e){el.value='';await dlg(`<h2>${t('Cannot import this file','Hindi ma-import ang file')}</h2><p>${esc(e.message)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-v="x" data-focus>${t('OK','OK')}</button></div>`);return}
 const d=obj.data;const mode=await dlg(`<h2>${t('Import backup','I-import ang backup')}</h2><p>${t('Backup from','Backup mula')} <b>${esc(String(obj.exported||'').slice(0,10))}</b>: ${(d.cases||[]).length} ${t('cases','kaso')}, ${(d.procs||[]).length} ${t('step sets','step set')}, ${Object.keys(d.notes||{}).length} ${t('topic notes','tala sa paksa')}, ${(obj.images||[]).length} ${t('photos','larawan')}.</p><p><b>${t('Merge','Pagsamahin')}</b> ${t('keeps what you have and adds items from the backup.','ay pinapanatili ang mayroon ka at idinaragdag ang nasa backup.')} <b>${t('Replace','Palitan')}</b> ${t('deletes current data first.','ay buburahin muna ang kasalukuyang data.')}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-v="cancel">${t('Cancel','Kanselahin')}</button><button class="btn sec" data-v="replace">${t('Replace','Palitan')}</button><button class="btn" data-v="merge" data-focus>${t('Merge','Pagsamahin')}</button></div>`,{cancelValue:'cancel'});
 el.value='';if(mode==='cancel'||!mode)return;
 try{if(mode==='replace'){await DB.clearAll();S.cases=[];S.procs=[];S.notes={};S.saved=[];S.history=[];S.seen={};S.session=null;S.last=null}
  const byId=(a,b)=>{const m=new Map(a.map(x=>[x.id,x]));(b||[]).forEach(x=>{if(x&&x.id)m.set(x.id,x)});return [...m.values()]};
  S.cases=byId(S.cases,d.cases);S.procs=byId(S.procs,d.procs);S.history=byId(S.history,d.history);S.notes=Object.assign({},S.notes,d.notes||{});S.saved=[...new Set([...S.saved,...(d.saved||[])])];S.seen=Object.assign({},S.seen,d.seen||{});if(d.last&&!S.last)S.last=d.last;
  for(const k of ['cases','procs','history','notes','saved','seen','last','session'])await persist(k);
  for(const im of obj.images||[]){if(im&&im.id&&im.dataUrl)await DB.putImage({id:im.id,procId:im.procId,name:im.name,type:im.type,blob:dataURLToBlob(im.dataUrl)})}
  if(obj.prefs&&mode==='replace'){P=Object.assign({},DEFAULT_PREFS,obj.prefs);savePrefs();applyTheme()}
  toast(t('Backup imported.','Na-import ang backup.'));renderShell();ROUTE_NOFOCUS=true;vSettings()}
 catch(e){toast(t('Import failed: ','Nabigo ang import: ')+e.message,'bad',8000)}};
ACT.cleardata=async()=>{const v=await dlg(`<h2>${t('Clear data from this device?','Buburahin ang data sa device na ito?')}</h2><p>${t('This permanently deletes your case log, step sets and photos, topic notes, saved questions, quiz progress and history from this browser. It cannot be undone.','Permanenteng buburahin ang iyong case log, step set at larawan, tala, naka-save na tanong, progreso at history sa browser na ito. Hindi na ito maibabalik.')}</p><p class="small muted">${t('Tip: export a backup first.','Tip: mag-export muna ng backup.')}</p><div class="stack"><button class="btn danger" data-v="data" style="width:100%">${t('Delete study data (keep language and appearance)','Burahin ang study data (panatilihin ang wika at hitsura)')}</button><button class="btn danger" data-v="all" style="width:100%">${t('Delete everything, including settings','Burahin lahat, kasama ang setting')}</button><button class="btn ghost" data-v="no" data-focus style="width:100%">${t('Cancel — keep my data','Kanselahin — itago ang data')}</button></div>`,{cancelValue:'no'});
 if(v!=='data'&&v!=='all')return;
 await DB.clearAll();Object.assign(S,{cases:[],procs:[],notes:{},saved:[],history:[],seen:{},session:null,last:null});DRAFT=null;
 if(v==='all'){try{Object.keys(localStorage).filter(k=>k.startsWith('pnle.')).forEach(k=>localStorage.removeItem(k))}catch(e){}P=Object.assign({},DEFAULT_PREFS);applyTheme()}
 toast(t('Data cleared from this device.','Nabura ang data sa device na ito.'));renderShell();ROUTE_NOFOCUS=true;vSettings()};

/* ===================== INIT ===================== */
function bindEvents(){
 const m=$('#main');
 m.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act]){if(el.tagName==='A'&&el.dataset.act!=='revarea'&&false)e.preventDefault();Promise.resolve(ACT[el.dataset.act](el,e)).catch(err=>{console.error(err);toast(t('Something went wrong: ','May nangyaring mali: ')+err.message,'bad')})}});
 m.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg]){const target=e.target;Promise.resolve(CHG[el.dataset.chg](el.tagName==='FORM'||el.tagName==='DIV'?target:el,e)).catch(err=>{console.error(err);toast(err.message,'bad')})}});
 m.addEventListener('input',e=>{const el=e.target.closest('[data-inp]');if(el&&INP[el.dataset.inp])INP[el.dataset.inp](el.tagName==='FORM'?e.target:el,e)});
 $('#menubtn').addEventListener('click',()=>{const s=$('#side'),o=!s.classList.contains('open');s.classList.toggle('open',o);$('#scrim').classList.toggle('show',o);$('#menubtn').setAttribute('aria-expanded',String(o));if(o){const a=$('#nav a');a&&a.focus()}});
 $('#scrim').addEventListener('click',()=>{$('#side').classList.remove('open');$('#scrim').classList.remove('show');$('#menubtn').setAttribute('aria-expanded','false')});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#side').classList.contains('open')){$('#side').classList.remove('open');$('#scrim').classList.remove('show');$('#menubtn').setAttribute('aria-expanded','false');$('#menubtn').focus()}});
 window.addEventListener('hashchange',route);
 window.addEventListener('beforeunload',()=>{if(S.session)DB.set('session',S.session)});
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.session)DB.set('session',S.session)});
}
(async function init(){
 applyTheme();await DB.init();await loadState();
 if(S.session&&(!Array.isArray(S.session.qids)||S.session.done)){S.session=null}
 if(S.session){S.session.qids=S.session.qids.filter(id=>QMAP[id]);if(!S.session.qids.length)S.session=null;else S.session.cur=Math.min(S.session.cur||0,S.session.qids.length-1)}
 bindEvents();route();
})();

</script>
</body>
</html>
