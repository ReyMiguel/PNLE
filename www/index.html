<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Unofficial self-study practice and reviewer for the Philippine Nurse Licensure Examination (PNLE/NLE), organized by Nursing Practice I-V. Works offline in your browser; data stays on your device.">
<title>PNLE Study Hub (unofficial)</title>
<style>
:root{--bg:#f3f7f6;--surface:#fff;--surface2:#e9f0ee;--line:#c9d6d3;--text:#15222a;--muted:#47565e;--accent:#0f6b73;--on-accent:#fff;--accent-ink:#0f6b73;--accent-soft:#dcecec;--ok:#1d6b3e;--ok-soft:#dff0e5;--bad:#a8231b;--bad-soft:#f8e1de;--warn:#7d5200;--warn-soft:#f8ecd2;--radius:10px;--side:248px}
*{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;min-height:100vh}
a{color:var(--accent-ink);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5rem;font-weight:650;letter-spacing:-.005em}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:.4rem 0 .8rem}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--on-accent);padding:.6rem 1rem;z-index:100;border-radius:0 0 8px 0}
.skip:focus{left:0}
:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px;border-radius:4px}
svg.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
/* layout */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:1rem .75rem;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:.6rem;align-items:center;padding:.25rem .5rem 1rem;font-weight:700;font-size:1.05rem}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.72rem;line-height:1.2}
.nav a{display:flex;gap:.65rem;align-items:center;padding:.6rem .7rem;border-radius:8px;color:var(--text);text-decoration:none;font-weight:550;margin:2px 0}
.nav a small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;line-height:1.1}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current=page]{background:var(--accent-soft);color:var(--accent-ink)}
.nav hr{border:0;border-top:1px solid var(--line);margin:.6rem 0}
.top{display:none}
main{padding:1.5rem clamp(1rem,3vw,2.5rem) 3rem;max-width:1040px;width:100%;margin:0 auto}
main:focus{outline:none}
.foot{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
@media(max-width:899px){
 .app{display:block}
 .side{position:fixed;inset:0 auto 0 0;width:min(86vw,300px);transform:translateX(-105%);transition:transform .2s;z-index:40;height:100%}
 .side.open{transform:none;box-shadow:0 0 40px #0006}
 .scrim{position:fixed;inset:0;background:#0006;z-index:30;display:none}.scrim.show{display:block}
 .top{display:flex;align-items:center;gap:.6rem;background:var(--surface);border-bottom:1px solid var(--line);padding:.5rem .75rem;position:sticky;top:0;z-index:20}
 .top .t{font-weight:700}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* controls */
.btn{display:inline-flex;gap:.45rem;align-items:center;justify-content:center;font:inherit;font-weight:600;border:1.5px solid var(--accent-ink);background:var(--accent);color:var(--on-accent);padding:.55rem 1rem;border-radius:8px;cursor:pointer;text-decoration:none;min-height:2.5rem}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent;color:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:.3rem .65rem;min-height:2rem;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.row.sp{justify-content:space-between}
.stack>*+*{margin-top:.9rem}
label.f{display:block;font-weight:600;margin-bottom:.25rem}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:.5rem .65rem;min-height:2.5rem}
textarea{min-height:5.5rem;resize:vertical}
input[type=color]{width:3rem;height:2.5rem;padding:2px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent-ink)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent-ink);width:1.1rem;height:1.1rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.chk{display:flex;gap:.5rem;align-items:center;padding:.25rem 0}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:.1rem .6rem;color:var(--text)}
.chip.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dot{width:.7rem;height:.7rem;border-radius:50%;display:inline-block}
.notice{border:1.5px solid var(--warn);background:var(--warn-soft);color:var(--text);border-radius:var(--radius);padding:.7rem .9rem;display:flex;gap:.65rem;align-items:flex-start;margin:.8rem 0}
.notice svg{color:var(--warn);margin-top:.2rem}
.notice.info{border-color:var(--accent-ink);background:var(--accent-soft)}
.notice.info svg{color:var(--accent-ink)}
.notice.bad{border-color:var(--bad);background:var(--bad-soft)}.notice.bad svg{color:var(--bad)}
.notice.good{border-color:var(--ok);background:var(--ok-soft)}.notice.good svg{color:var(--ok)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem}
.sect{margin-top:1.8rem}
.sect>h2{padding-bottom:.35rem;border-bottom:1px solid var(--line);margin-bottom:.8rem}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;border-bottom:1px solid var(--line);padding:.45rem .6rem;vertical-align:top}
th{background:var(--surface2);font-weight:650}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tw table{min-width:420px}
.bar{height:.6rem;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
details{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:.5rem 0}
details>summary{cursor:pointer;padding:.6rem .8rem;font-weight:600;list-style-position:inside}
details>.inner{padding:.2rem .9rem .9rem}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);padding:1.2rem;max-width:min(92vw,520px);width:100%}
dialog.wide{max-width:min(94vw,900px)}
dialog::backdrop{background:#0008}
.toasts{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:.5rem;z-index:80;width:min(92vw,460px)}
.toast{background:var(--text);color:var(--bg);padding:.65rem .9rem;border-radius:8px;box-shadow:0 6px 24px #0005;font-weight:550}
.toast.bad{background:var(--bad);color:#fff}
.banner{background:var(--bad-soft);border-bottom:2px solid var(--bad);padding:.6rem 1rem;font-size:.92rem}
/* home */
.hero{padding:1.2rem 0 .4rem}
.hero p.lead{font-size:1.08rem;max-width:62ch;color:var(--muted)}
.area-list{display:grid;gap:.75rem}
.area-row{display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ac,var(--accent));border-radius:var(--radius);padding:.8rem 1rem}
.area-row h3{margin:0}
.area-row .acts{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:640px){.area-row{grid-template-columns:1fr}.area-row .acts{justify-content:flex-start}}
/* quiz */
.qwrap{display:grid;grid-template-columns:1fr 230px;gap:1.2rem;align-items:start}
@media(max-width:899px){.qwrap{grid-template-columns:1fr}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem}
.qmeta{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.7rem}
.stem{font-size:1.08rem;margin:.4rem 0 1rem}
.opts{border:0;padding:0;margin:0;display:grid;gap:.55rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:.65rem .8rem;cursor:pointer}
.opt:hover{border-color:var(--accent-ink)}
.opt input{margin-top:.25rem}
.opt .L{font-weight:700;min-width:1.2rem}
.opt.sel{border-color:var(--accent-ink);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.locked{cursor:default}
.fb{margin-top:1rem;border-top:1px solid var(--line);padding-top:.9rem}
.fb h3.ok{color:var(--ok)}.fb h3.bad{color:var(--bad)}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.5rem,1fr));gap:.35rem}
.qnav button{font:inherit;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:7px;min-height:2.4rem;cursor:pointer;position:relative}
.qnav button.ans{background:var(--accent-soft);border-color:var(--accent-ink)}
.qnav button.cur{outline:3px solid var(--accent-ink);outline-offset:1px}
.qnav button.flg::after{content:"";position:absolute;top:2px;right:2px;border:5px solid transparent;border-top-color:var(--warn);border-right-color:var(--warn)}
.qnav button.okk{background:var(--ok-soft);border-color:var(--ok)}
.qnav button.nok{background:var(--bad-soft);border-color:var(--bad)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem}
.timer.low{color:var(--bad)}
.score{font-size:2.6rem;font-weight:750;line-height:1}
/* reviewer */
.topic-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.5rem}
.topic-list a{display:block;padding:.6rem .8rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none;color:var(--text);font-weight:550}
.topic-list a:hover{border-color:var(--accent-ink)}
.mn{border-left:5px solid var(--accent);background:var(--accent-soft);padding:.6rem .9rem;border-radius:0 8px 8px 0;margin:1rem 0}
.mn b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
ul.pts{padding-left:1.2rem}ul.pts li{margin:.3rem 0}
figure.dia{margin:1rem 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.8rem}
figure.dia svg{width:100%;height:auto;max-height:70vh;display:block}
figure.dia figcaption{font-size:.9rem;color:var(--muted);margin-top:.5rem}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:1rem}
/* svg */
svg .sv-b{fill:var(--surface2);stroke:var(--line);stroke-width:1.5}
svg .sv-ac{fill:var(--accent-soft);stroke:var(--accent-ink);stroke-width:1.5}
svg .sv-ox{fill:#f4c9c4;stroke:#a8231b;stroke-width:1.5}
svg .sv-dx{fill:#c7d9f2;stroke:#25508f;stroke-width:1.5}
svg .sv-t{fill:var(--text);font:600 12.5px system-ui,sans-serif}
svg .sv-td{fill:#14202a;font:600 12.5px system-ui,sans-serif}
svg .sv-s{fill:var(--muted);font:500 11.5px system-ui,sans-serif}
svg .sv-l{stroke:var(--muted);stroke-width:1.8}
svg .sv-g{stroke:var(--line);stroke-width:1}
svg .sv-bar{fill:var(--accent-soft);stroke:var(--accent-ink);stroke-width:1.2}
svg .sv-pk{fill:var(--accent);stroke:var(--accent-ink)}
svg marker path{fill:var(--muted)}
/* ocr / steps */
.imgrow{display:grid;grid-template-columns:minmax(120px,240px) 1fr;gap:1rem;align-items:start}
@media(max-width:640px){.imgrow{grid-template-columns:1fr}}
.imgrow img{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;max-height:340px;object-fit:contain}
.step{display:grid;grid-template-columns:2.2rem 1fr auto;gap:.6rem;align-items:start;padding:.6rem;border:1px solid var(--line);border-radius:9px;background:var(--surface);margin:.5rem 0}
.step.unsure{border-color:var(--warn);background:var(--warn-soft)}
.step .n{font-weight:750;font-size:1.1rem;color:var(--accent-ink);padding-top:.35rem;text-align:center}
.step .tools{display:flex;flex-direction:column;gap:.3rem}
.card-step{border:2px solid var(--accent-ink);border-radius:14px;background:var(--surface);padding:1.4rem;min-height:11rem;display:flex;flex-direction:column;justify-content:center}
.card-step .num{font-weight:750;color:var(--accent-ink)}
.card-step .txt{font-size:1.3rem;margin-top:.4rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.8rem 0}
.tabs button{font:inherit;font-weight:600;padding:.45rem .9rem;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.tabs button[aria-pressed=true],.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent-ink);color:var(--on-accent)}
.cklist label{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:.35rem 0;cursor:pointer}
.cklist input:checked+span{text-decoration:line-through;color:var(--muted)}
/* cases + settings */
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1rem;margin:.7rem 0}
.case h3{margin-bottom:.2rem}
.sw{display:inline-flex;align-items:center;gap:.45rem;border:2px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:.3rem .75rem .3rem .35rem;font:inherit;font-weight:600;cursor:pointer}
.sw i{width:1.3rem;height:1.3rem;border-radius:50%;border:1px solid #0004;display:inline-block}
.sw[aria-pressed=true]{border-color:var(--accent-ink);box-shadow:0 0 0 2px var(--accent-soft)}
.preview{border:1px dashed var(--line);border-radius:var(--radius);padding:1rem;background:var(--bg)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{padding:.45rem .9rem;cursor:pointer;font-weight:600;background:var(--surface);border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--accent-ink)}
.seg label:has(input:checked){background:var(--accent-soft)}
.seg label:has(input:focus-visible){outline:3px solid var(--accent-ink);outline-offset:-3px}
.empty{border:1.5px dashed var(--line);border-radius:var(--radius);padding:1.6rem;text-align:center;color:var(--muted);background:var(--surface)}
.empty svg{width:2rem;height:2rem;margin-bottom:.4rem}
.refitem{padding:.8rem 0;border-bottom:1px solid var(--line)}
.refitem h3{margin:0 0 .15rem;font-size:1rem}
.prog{display:flex;align-items:center;gap:.6rem}
.prog .bar{flex:1}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div id="store-banner" class="banner" role="alert" hidden></div>
<div class="app">
 <aside class="side" id="side" aria-label="Main navigation">
  <div class="brand"><span class="logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:1.3rem;height:1.3rem"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></span><span>PNLE Study Hub<small>Unofficial practice · Hindi opisyal</small></span></div>
  <nav id="nav" class="nav" aria-label="Primary"></nav>
  <p id="nav-foot" class="small muted" style="padding:.6rem .5rem"></p>
 </aside>
 <div>
  <div class="top"><button id="menubtn" class="btn sm ghost" aria-controls="side" aria-expanded="false" aria-label="Open menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button><span class="t">PNLE Study Hub</span></div>
  <main id="main" tabindex="-1"><noscript>This study app needs JavaScript enabled in your browser.</noscript></main>
 </div>
</div>
<div id="scrim" class="scrim"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<script>
"use strict";
/* ===== REFERENCES (status: 'checked' = opened/located 2026-11-24; 'pending' = real publisher page, link not machine-checked in this build — please open to confirm) ===== */
const REFS = [
 {id:'prc_tos',grp:'Official PRC',title:'Enhanced Tables of Specifications for the Subjects in the Nurses Licensure Examination, Resolution No. 10 (s. 2025)',org:'Professional Regulation Commission (PRC), Professional Regulatory Board of Nursing',date:'2025',url:'https://www.prc.gov.ph/sites/default/files/2025-10%20%20published%20Enhanced%20TOS%20nuse.pdf',note:'Basis for the study structure (Nursing Practice I–V). Document was opened on 2026-11-24; no newer PRC table of specifications was found in a search that day. Always re-check prc.gov.ph.',st:'checked'},

 {id:'ra9173',grp:'Philippine law & policy',title:'Republic Act No. 9173 — Philippine Nursing Act of 2002',org:'Congress of the Philippines (via Lawphil)',date:'2002',url:'https://lawphil.net/statutes/repacts/ra2002/ra_9173_2002.html',note:'Scope of nursing practice, responsibilities, and ethics context. Title confirmed on 2026-11-24.',st:'checked'},
 {id:'ra10173',grp:'Philippine law & policy',title:'Data Privacy Act of 2012 (Republic Act No. 10173)',org:'National Privacy Commission, Philippines',date:'2012',url:'https://www.privacy.gov.ph/data-privacy-act/',note:'Confidentiality and handling of personal and sensitive personal information, including health data.',st:'pending'},
 {id:'ra10028',grp:'Philippine law & policy',title:'Republic Act No. 10028 — Expanded Breastfeeding Promotion Act of 2009',org:'Congress of the Philippines (via Lawphil)',date:'2010',url:'https://lawphil.net/statutes/repacts/ra2010/ra_10028_2010.html',note:'Workplace lactation support and breastfeeding promotion in the Philippines.',st:'pending'},
 {id:'doh',grp:'Philippine law & policy',title:'Department of Health (Philippines) — official website',org:'Department of Health, Philippines',date:'current',url:'https://doh.gov.ph/',note:'Entry point for current DOH programs and issuances (EPI immunization schedule, TB, dengue, EINC/“Unang Yakap”, family planning). Schedules change; confirm against the current DOH issuance.',st:'pending'},
 {id:'who_hh',grp:'Clinical guidelines',title:'WHO Guidelines on Hand Hygiene in Health Care',org:'World Health Organization',date:'2009',url:'https://www.who.int/publications/i/item/9789241597906',note:'Hand hygiene indications (five moments), alcohol rub vs. soap and water.',st:'pending'},
 {id:'cdc_sp',grp:'Clinical guidelines',title:'Standard Precautions for All Patient Care',org:'US Centers for Disease Control and Prevention (CDC)',date:'current',url:'https://www.cdc.gov/infection-control/hcp/basics/standard-precautions.html',note:'Standard precautions, PPE, sharps safety.',st:'pending'},
 {id:'cdc_iso',grp:'Clinical guidelines',title:'Isolation Precautions (Guideline for Isolation Precautions)',org:'US Centers for Disease Control and Prevention (CDC)',date:'current',url:'https://www.cdc.gov/infection-control/hcp/isolation-precautions/index.html',note:'Contact, droplet, and airborne precautions.',st:'pending'},
 {id:'aha',grp:'Clinical guidelines',title:'CPR & ECC Guidelines',org:'American Heart Association',date:'latest update (verify year on page)',url:'https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines',note:'Adult basic and advanced life support, compression rate/depth, defibrillation. Guidelines are periodically revised.',st:'pending'},
 {id:'ssc',grp:'Clinical guidelines',title:'Surviving Sepsis Campaign: Adult Guidelines',org:'Society of Critical Care Medicine / ESICM',date:'2021 edition (check for newer)',url:'https://www.sccm.org/survivingsepsiscampaign/guidelines-and-resources/surviving-sepsis-campaign-adult-guidelines',note:'Sepsis recognition, cultures, antimicrobial timing, fluid resuscitation.',st:'pending'},

   Q(area, topic, difficulty 1-3, stem, options[4], correctIndex, rationale, whyOthersLess, filipinoRationale, sourceRefId, flagText?) */
const QS = [];
/* Option order is fixed (seeded, balanced) so the correct-answer position is spread evenly across A–D. */
let _seed=20261124;const _rnd=()=>{_seed=(_seed*1664525+1013904223)>>>0;return _seed/4294967296};
let _pos=[];
function _nextPos(){if(!_pos.length){_pos=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(_rnd()*(i+1));[_pos[i],_pos[j]]=[_pos[j],_pos[i]]}}return _pos.pop()}
function Q(a,t,d,q,o,k,r,w,f,s,fl){const right=o[k];const rest=o.filter((_,i)=>i!==k);
 for(let i=rest.length-1;i>0;i--){const j=Math.floor(_rnd()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}
 const pos=_nextPos();rest.splice(pos,0,right);
 QS.push({id:'q'+String(QS.length+1).padStart(3,'0'),a,t,d,q,o:rest,k:pos,r,w,f,s,fl:fl||''}); }

/* ---------- Nursing Practice I ---------- */
Q(1,'phc',1,"During a barangay immunization day, the nurse gives hepatitis B vaccine to a newborn. At which level of prevention does this action belong?",
 ["Secondary prevention","Primary prevention","Tertiary prevention","Palliative care"],1,
 "Immunization prevents disease before it occurs, so it is primary prevention.",
 "Secondary prevention is early detection (screening); tertiary prevention limits disability and rehabilitates after disease; palliative care is not a level of prevention.",
 "Pinipigilan ng bakuna ang sakit bago pa ito mangyari, kaya primary prevention.","doh");
Q(1,'phc',2,"Residents of a barangay, guided by the nurse, decide that unsafe water is their top concern, plan a chlorination project, and manage it themselves. Which primary health care principle is best shown?",
 ["Equitable distribution of resources","Intersectoral collaboration","Community participation and self-reliance","Use of appropriate technology"],2,
 "Residents identified the problem, planned, and run the project: community participation and self-reliance.",
 "Equity concerns fair access; intersectoral collaboration involves several sectors working together; appropriate technology concerns suitable, affordable tools. None is the central feature of this scenario.",
 "Ang mga residente mismo ang nagtukoy, nagplano at namamahala: community participation at self-reliance.","openstax");
Q(1,'epi',2,"At the start of the year, 2,000 barangay residents are free of dengue. During the year, 40 of them develop dengue. What is the incidence rate?",
 ["2 per 1,000 population at risk","20 per 1,000 population at risk","40 per 1,000 population at risk","200 per 1,000 population at risk"],1,
 "Incidence = new cases ÷ population at risk = 40 ÷ 2,000 = 0.02, or 20 per 1,000.",
 "2 and 200 are decimal-place errors; 40 is the number of cases, not a rate per 1,000.",
 "Incidence = bagong kaso ÷ populasyong nasa panganib = 40/2,000 = 20 bawat 1,000.","openstax");
Q(1,'epi',2,"A health center screens household contacts of a client with pulmonary TB using symptom review and chest X-ray. At which level of prevention is this activity?",
 ["Primary prevention","Tertiary prevention","Secondary prevention","Health promotion only"],2,
 "Screening to find disease early in people at risk is secondary prevention.",
 "Primary prevention stops disease onset (e.g., vaccination); tertiary prevention limits disability from established disease; health promotion alone does not describe case finding.",
 "Ang screening upang maagang matuklasan ang sakit ay secondary prevention.","who_tb");
Q(1,'epi',3,"Which study design gives the strongest evidence that a nursing intervention causes an improvement in patient outcomes?",
 ["Cross-sectional survey","Case series","Descriptive correlational study","Randomized controlled trial"],3,
 "Random assignment to intervention and control groups reduces bias and best supports cause-and-effect conclusions.",
 "Surveys, case series and correlational studies can show association or describe cases but cannot control confounders the way randomization does.",
 "Ang randomization ang pinakamahusay na nagpapakita ng sanhi at bunga.","openstax");
Q(1,'cd',2,"On day 4 of illness, a 9-year-old with dengue is afebrile but now has persistent vomiting, severe abdominal pain and lethargy. What is the nurse's best action?",
 ["Reassure the mother that the fever has gone and recovery has begun","Report promptly as warning signs of severe dengue and prepare for urgent evaluation and IV fluids","Give aspirin for the abdominal pain","Advise oral fluids at home and review in 3 days"],1,
 "Persistent vomiting, severe abdominal pain and lethargy around defervescence are warning signs of plasma leakage and need urgent medical evaluation.",
 "Falling fever is the critical phase, not recovery; aspirin/NSAIDs increase bleeding risk; waiting at home delays care.",
 "Ang matinding pagsusuka, pananakit ng tiyan at panghihina ay warning signs; kailangan ng agarang medikal na pagsusuri.","who_dengue","Clinical pathways follow current DOH/WHO dengue guidance.");
Q(1,'cd',1,"Which community strategy has the greatest long-term effect on dengue transmission?",
 ["Weekly fogging of all households","Search and destroy mosquito breeding sites","Prophylactic antibiotics for children","Quarantine of every febrile child"],1,
 "Eliminating breeding sites (e.g., stagnant water containers) reduces the vector sustainably.",
 "Fogging kills adult mosquitoes only briefly and is reserved for outbreaks; dengue is viral so antibiotics do not help; quarantine of all febrile children is impractical and not a vector-control measure.",
 "Ang pagsira sa pinamumugaran ng lamok ang pinakamabisang pangmatagalang hakbang.","who_dengue");
Q(1,'cd',2,"A newly diagnosed adult has drug-susceptible pulmonary TB. Which drugs make up the standard intensive-phase regimen?",
 ["Isoniazid, rifampicin, pyrazinamide and ethambutol","Isoniazid and rifampicin only","Streptomycin, ethambutol and ciprofloxacin","Rifampicin, pyrazinamide and amoxicillin"],0,
 "The standard intensive phase uses four first-line drugs (HRZE), followed by a continuation phase.",
 "Two-drug combinations are used in the continuation phase; the other combinations are not standard first-line intensive regimens.",
 "Ang intensive phase ay gumagamit ng apat na gamot: isoniazid, rifampicin, pyrazinamide at ethambutol.","who_tb","Regimens and durations (including shorter regimens) are updated by WHO and the Philippine NTP; confirm current policy.");
Q(1,'cd',1,"A client taking rifampicin asks why the urine is orange-red. What is the best nursing response?",
 ["Stop the drug now and go to the emergency room","This is an expected, harmless drug effect; report yellowing of the skin or eyes","This means the TB is getting worse","This means you are allergic and the drug must be changed"],1,
 "Rifampicin colors urine, sweat and tears orange-red. Teach that this is expected, and to report jaundice, dark urine with pale stools, or persistent vomiting (possible liver injury).",
 "Stopping treatment abruptly risks relapse and resistance; color change does not indicate worsening TB or allergy.",
 "Normal na epekto ng rifampicin ang kulay-kahel na ihi; iulat kung may paninilaw ng balat o mata.","ml_tb");
Q(1,'cd',2,"A farmer has sudden fever, severe calf pain and red eyes without discharge after wading through floodwater. Which condition should the nurse suspect?",
 ["Typhoid fever","Malaria","Leptospirosis","Hepatitis A"],2,
 "Flood-water exposure with fever, calf myalgia and conjunctival suffusion is classic for leptospirosis.",
 "Typhoid and hepatitis A are fecal–oral without this exposure pattern; malaria needs mosquito exposure in endemic areas and does not typically cause calf pain with conjunctival suffusion.",
 "Lagnat, pananakit ng binti at pulang mata matapos lumusong sa baha: leptospirosis.","doh","Prophylaxis and treatment protocols follow current DOH guidance after floods.");
Q(1,'cd',1,"A child is bitten on the leg by a stray dog. What should be done first?",
 ["Apply a tight tourniquet above the wound","Wash the wound thoroughly with soap and running water for at least 15 minutes","Suture the wound immediately","Cover tightly with a bandage without washing"],1,
 "Prompt, prolonged wound washing with soap and water is the most important first step; then seek medical evaluation for rabies post-exposure prophylaxis.",
 "Tourniquets and tight bandages are not recommended; suturing a fresh bite can trap virus and bacteria.",
 "Hugasan agad ng sabon at umaagos na tubig nang hindi bababa sa 15 minuto.","who_rabies");
Q(1,'imm',1,"In the Philippine Expanded Program on Immunization, which of these vaccines is traditionally given soon after birth?",
 ["Measles-rubella vaccine","Bacillus Calmette–Guérin (BCG)","Pneumococcal conjugate vaccine","Inactivated polio vaccine"],1,
 "BCG (with a hepatitis B birth dose) is given at birth; the others are scheduled at later ages.",
 "Measles-rubella, pneumococcal conjugate and polio vaccines are given from weeks to months of age.",
 "Ang BCG ay ibinibigay pagkapanganak; ang iba ay sa mas huling edad.","doh","EPI schedules change; confirm the current DOH schedule.");
Q(1,'imm',2,"Routine vaccines in a health-center refrigerator should be kept within which temperature range?",
 ["−15 to −25 °C","2 to 8 °C","10 to 15 °C","20 to 25 °C"],1,
 "Most routine vaccines are stored at 2–8 °C; freezing can destroy potency of several vaccines and heat degrades others.",
 "Freezer temperatures harm freeze-sensitive vaccines; 10–25 °C is too warm for routine storage.",
 "Karaniwang itinatago ang bakuna sa 2–8 °C.","doh","Always follow the manufacturer's label and current DOH cold-chain guidance for each vaccine.");
Q(1,'imm',2,"A mother brings her 10-month-old, who has a mild cough, runny nose and temperature of 37.6 °C, for measles-containing vaccine. What is the best action?",
 ["Postpone until the child is completely well","Proceed with vaccination after checking for danger signs","Refer for chest X-ray first","Give 7 days of antibiotics before vaccinating"],1,
 "Minor illness without danger signs is not a contraindication; postponing creates missed opportunities.",
 "Delay, imaging, or antibiotics are unnecessary for a mild respiratory infection without danger signs.",
 "Hindi hadlang ang banayad na ubo at sipon kung walang danger signs.","doh","Contraindication rules follow current DOH/WHO immunization guidance.");
Q(1,'fam',2,"A young couple expecting their first baby has no illness but anticipates changes in roles and finances. In the Bailon–Maglaya classification of family health problems, this is a:",
 ["Health threat","Foreseeable crisis","Health deficit","Family dysfunction"],1,
 "A foreseeable crisis is an anticipated stress point in family life, such as marriage, pregnancy or a new baby.",
 "A health threat is a condition that may lead to illness (e.g., unsafe water); a health deficit is an actual illness or failure of health; 'family dysfunction' is not one of the categories.",
 "Ang inaasahang pagbabago tulad ng pagbubuntis ay foreseeable crisis.","openstax");
Q(1,'fam',1,"A nurse asks a mother to prepare oral rehydration solution while the nurse observes. Which domain of learning is being evaluated?",
 ["Cognitive","Affective","Psychomotor","Spiritual"],2,
 "Performing a skill is psychomotor learning, and return demonstration is the way to evaluate it.",
 "Cognitive concerns knowledge; affective concerns attitudes and values; 'spiritual' is not a learning domain.",
 "Ang return demonstration ay sumusukat sa psychomotor domain.","openrn");
Q(1,'fam',2,"What is the main purpose of the bag technique during a home visit?",
 ["To reduce the cost of supplies","To prevent transmission of microorganisms from one household to another","To allow the nurse to skip hand hygiene","To impress the family with complete equipment"],1,
 "The bag technique protects clients, families, the nurse and the bag's contents from cross-contamination between households.",
 "Cost and appearance are not its purpose; it never replaces hand hygiene, which is performed before and after care.",
 "Pinipigilan ng bag technique ang paglipat ng mikrobyo mula sa isang tahanan patungo sa iba.","openrn");
Q(1,'prof',2,"A nurse researcher plans to interview patients about their care. Which ethical requirement must be met before data collection?",
 ["The ward manager signs for all patients","Names are listed in the report for accuracy","Participants give voluntary informed consent and may withdraw without penalty","Participation is required to receive care"],2,
 "Respect for persons requires voluntary, informed consent and the freedom to withdraw without penalty.",
 "Proxy consent for everyone, publishing names, or coercing participation violate autonomy and confidentiality.",
 "Kailangan ang boluntaryong informed consent at karapatang umatras nang walang parusa.","openrn");
Q(1,'prof',2,"A charge nurse delegates a task to a nursing aide. Which statement best reflects accountability?",
 ["The aide alone is accountable for the outcome","The delegating nurse remains accountable for appropriate delegation and supervision","Accountability moves entirely to the aide once the task is accepted","No one is accountable if the task is routine"],1,
 "Delegating a task does not delegate accountability; the nurse is responsible for choosing a suitable task and person, giving clear instructions and supervising.",
 "Accountability cannot be fully transferred, and routine tasks still need oversight.",
 "Nananatiling accountable ang nurse na nag-delegate; kasama ang tamang pagpili at pangangasiwa.","openrn","Which tasks may be delegated depends on law, facility policy and the delegatee's competence.");
Q(1,'prof',2,"A student nurse wants to post a photo of the ward census board and a patient's initials on social media to share a learning day. What should the nurse advise?",
 ["Post it if only initials are shown","Do not post it; even partial information can identify a patient and breaches confidentiality","Post it on a private account only","Post it once the patient is discharged"],1,
 "Health information is sensitive personal information; initials, ward and dates can identify a person. Share only properly de-identified learning, in approved settings.",
 "Private accounts and discharge do not remove the duty of confidentiality, and initials remain identifying.",
 "Kahit bahagyang impormasyon ay maaaring makilala ang pasyente; labag ito sa confidentiality.","ra10173","Institutional social-media and privacy policies also apply.");
Q(1,'ic',1,"In which situation should a nurse use soap and water rather than alcohol-based hand rub?",
 ["Before touching a patient with intact skin","When hands are visibly soiled with blood or body fluids","After removing a blood-pressure cuff from a clean patient","Before entering a room when hands look clean"],1,
 "Alcohol rub is preferred for routine care when hands are not visibly soiled; visibly soiled hands need soap and water.",
 "The other situations involve visibly clean hands, where alcohol rub is appropriate.",
 "Gumamit ng sabon at tubig kung halatang marumi ang kamay.","who_hh");
Q(1,'ic',2,"When leaving a patient's room after care with gloves, gown and mask, which PPE item should generally be removed first?",
 ["Mask or respirator","Gloves","Eye protection","Gown"],1,
 "Gloves are the most contaminated item and are removed first, followed by gown, eye protection and, last, the mask outside the room, with hand hygiene.",
 "Removing the mask or gown first risks touching the contaminated gloves to the face or clothing.",
 "Unang tinatanggal ang guwantes dahil ito ang pinakamarumi.","cdc_sp","Removal order varies slightly between guidelines; follow your facility's protocol.");

/* ---------- Nursing Practice II ---------- */
Q(2,'ante',1,"A client's last menstrual period began on March 5, 2026. Using Naegele's rule, what is her estimated date of delivery?",
 ["November 28, 2026","January 12, 2027","December 12, 2026","December 5, 2026"],2,
 "Naegele's rule: subtract 3 months from the first day of the LMP and add 7 days: March 5 → December 5, + 7 days = December 12, 2026.",
 "The other dates result from omitting the 7 days, adding the wrong month, or counting incorrectly.",
 "Naegele's rule: ibawas ang 3 buwan at idagdag ang 7 araw sa unang araw ng LMP.","ml_preg","EDD is an estimate; ultrasound dating may revise it.");
Q(2,'ante',2,"During Leopold's first maneuver, the nurse feels a firm, round, ballotable mass at the fundus. What does this suggest about presentation?",
 ["Cephalic presentation","Breech presentation","Transverse lie","Face presentation"],1,
 "A firm, round, ballotable mass in the fundus is the fetal head, which suggests the buttocks are the presenting part (breech).",
 "In cephalic presentation the fundus holds the softer, irregular buttocks; in transverse lie the fundus is typically empty; face presentation is determined at the pelvic inlet.",
 "Matigas, bilog at ballotable sa fundus ay ulo ng sanggol; ibig sabihin breech ang presentasyon.","ml_preg","Confirm presentation by ultrasound or provider assessment.");
Q(2,'comp',2,"A woman at 34 weeks with BP 150/100 mm Hg reports severe headache, blurred vision and epigastric pain. What is the priority nursing action?",
 ["Advise rest and recheck at the next scheduled visit","Report immediately; these may be severe features of preeclampsia and she needs urgent evaluation with seizure precautions","Give acetaminophen and send her home","Encourage a high-sodium diet"],1,
 "Severe headache, visual changes and epigastric pain with hypertension are warning signs of severe preeclampsia and impending eclampsia.",
 "Waiting, treating only the headache, or adding sodium delays urgent care and does not address seizure risk.",
 "Matinding sakit ng ulo, malabong paningin at pananakit ng sikmura ay babala ng severe preeclampsia.","ml_preg");
Q(2,'comp',3,"A client receiving magnesium sulfate has a respiratory rate of 10/min, absent patellar reflexes and urine output of 20 mL/h. What is the nurse's first action?",
 ["Continue the infusion and reassess in one hour","Stop the infusion, notify the provider and have calcium gluconate ready","Increase the infusion rate","Give oxygen only and continue the infusion"],1,
 "Depressed respirations, absent reflexes and oliguria indicate magnesium toxicity. Stop the drug, call for help, support breathing, and prepare the antidote calcium gluconate.",
 "Continuing or increasing the infusion worsens toxicity; oxygen alone does not remove the cause.",
 "Itigil ang infusion, ipaalam sa provider at ihanda ang calcium gluconate.","ml_preg","Monitoring parameters and antidote dosing follow facility protocol.");
Q(2,'labor',2,"A woman at 9 cm dilation is irritable, vomiting and says, “I can't do this.” What is the best nursing response?",
 ["Encourage her to push with every contraction now","Stay with her, coach calm breathing and reassure her that this phase is short","Leave the room to give her privacy","Tell her that her behavior is unreasonable"],1,
 "These are typical transition-phase behaviors. Continuous presence, calm coaching and reassurance are most helpful.",
 "Pushing before full dilation and urge can cause cervical swelling and exhaustion; leaving or criticizing increases fear.",
 "Karaniwan sa transition; manatili sa tabi niya, gabayan ang paghinga at paalalahanang saglit lang ito.","openstax");
Q(2,'labor',2,"During an oxytocin induction, the monitor shows late decelerations after contractions. What is the first nursing action?",
 ["Increase the oxytocin rate","Stop the oxytocin, reposition to left lateral, give oxygen per protocol and notify the provider","Ask the client to walk","Apply fundal pressure"],1,
 "Late decelerations signal uteroplacental insufficiency. Reduce uterine activity (stop oxytocin), improve placental perfusion (lateral position, fluids), and notify the provider.",
 "Increasing oxytocin, walking, or fundal pressure would worsen fetal hypoxia.",
 "Itigil ang oxytocin, ihiga nang patagilid at ipaalam sa provider.","openstax","Oxygen and fluid orders follow facility protocol.");
Q(2,'pp',2,"Two hours after birth, the fundus is boggy, above the umbilicus and deviated to the right. What is the most likely cause?",
 ["Normal involution","Distended bladder","Uterine infection","Perineal hematoma"],1,
 "A full bladder displaces the uterus upward and to the side and prevents it from contracting firmly. Assist the client to void, then massage the fundus if still boggy.",
 "Normal involution gives a firm midline fundus at or below the umbilicus; infection presents later with fever and tenderness; a hematoma does not typically displace the fundus.",
 "Ang puno na pantog ay nagtutulak sa matris pataas at pakanan.","openstax");
Q(2,'pp',1,"On postpartum day 6, which lochia is normally expected?",
 ["Bright red with clots","Pink-brown (lochia serosa)","White-yellow (lochia alba)","Foul-smelling green discharge"],1,
 "Lochia rubra lasts about 1–3 days, lochia serosa roughly day 4–10, and lochia alba afterwards.",
 "Bright red with clots at day 6 suggests bleeding; alba is later; foul green discharge suggests infection.",
 "Sa ika-6 na araw, inaasahan ang pink-brown na lochia serosa.","ml_preg");
Q(2,'nb',2,"At 1 minute, a newborn has heart rate 130/min, a vigorous cry, active movement, cries on stimulation, and a pink body with blue hands and feet. What is the Apgar score?",
 ["8","10","7","9"],3,
 "HR >100 = 2; respiratory effort (strong cry) = 2; muscle tone (active) = 2; reflex irritability (cry) = 2; color (acrocyanosis) = 1; total 9.",
 "10 ignores the acrocyanosis; 8 and 7 under-score one or more items.",
 "Apgar = 2+2+2+2+1 = 9.","openstax");
Q(2,'nb',1,"A term newborn cries vigorously right after vaginal birth. Which is the priority in the first minute under essential newborn care?",
 ["Cut the cord immediately and weigh the baby","Dry the baby thoroughly and place in skin-to-skin contact on the mother's abdomen","Suction the mouth and nose routinely","Bathe the baby to remove vernix"],1,
 "Immediate thorough drying and uninterrupted skin-to-skin contact prevent heat loss and promote bonding and breastfeeding; cord clamping is delayed in a well baby.",
 "Early cord cutting, routine suction and early bathing are not recommended for a vigorous term newborn.",
 "Patuyuin agad nang mabuti at ilagay sa dibdib/tiyan ng ina (skin-to-skin).","doh","Follow the current DOH essential intrapartum and newborn care protocol.");
Q(2,'nb',2,"Why is vitamin K routinely given to newborns?",
 ["To prevent neonatal jaundice","To prevent ophthalmia neonatorum","The newborn gut lacks the bacteria that produce vitamin K, so bleeding can occur","To boost the newborn's immunity"],2,
 "Newborns have a sterile gut and low vitamin K stores, which risks vitamin K deficiency bleeding.",
 "Jaundice is managed with phototherapy; eye prophylaxis prevents ophthalmia; vitamin K does not boost immunity.",
 "Wala pang bakterya sa bituka ng bagong silang na gumagawa ng vitamin K.","openstax");
Q(2,'nb',1,"For how long is exclusive breastfeeding recommended for healthy infants?",
 ["3 months","4 months","6 months","12 months"],2,
 "WHO recommends exclusive breastfeeding for the first 6 months, then complementary foods with continued breastfeeding.",
 "Shorter periods leave the infant without recommended protection; 12 months refers to continued breastfeeding, not exclusivity.",
 "Eksklusibong pagpapasuso hanggang 6 na buwan.","who_bf");
Q(2,'comp',1,"A routine oral glucose tolerance test to screen for gestational diabetes is commonly done at:",
 ["6–8 weeks","12–14 weeks","24–28 weeks","38–40 weeks"],2,
 "Universal screening is typically at 24–28 weeks, when placental hormones' insulin resistance rises.",
 "Earlier testing is done only for high-risk women; screening at term is too late to prevent complications.",
 "Karaniwang sinusuri ang GDM sa 24–28 linggo.","ml_preg","Timing and test type vary with risk and local protocol.");
Q(2,'comp',3,"A woman, 7 weeks amenorrheic, has sudden severe lower abdominal pain, dizziness, shoulder-tip pain and BP 84/50 mm Hg. What is the priority?",
 ["Give an oral analgesic and observe","Suspect ruptured ectopic pregnancy: call for help, give oxygen, start IV access and prepare for emergency care","Perform a vaginal examination to confirm","Encourage ambulation"],1,
 "Shoulder-tip pain and hypotension suggest hemoperitoneum from ruptured ectopic pregnancy, a surgical emergency.",
 "Observation delays rescue; vaginal examination may worsen bleeding; ambulation is unsafe in shock.",
 "Posibleng pumutok na ectopic pregnancy; kailangan ng agarang tulong.","ml_preg");
Q(2,'gd',1,"A 2-year-old says “no” to everything and insists on feeding himself. What is the best nursing approach?",
 ["Insist that he follows every instruction","Offer limited choices and allow safe independence","Punish negative behavior","Ignore him until he complies"],1,
 "Toddlers are in Erikson's autonomy vs. shame and doubt stage; limited choices support independence while keeping safety.",
 "Rigid control, punishment or ignoring promotes shame and doubt.",
 "Bigyan ng limitadong pagpipilian upang masuportahan ang awtonomiya.","openstax");
Q(2,'gd',2,"A hospitalized 4-year-old believes the injection is punishment for being naughty. What is the best response?",
 ["Agree that injections are given when children misbehave","Explain simply that the injection is medicine to help him and nothing he did caused it","Tell him not to be silly","Avoid explaining to prevent fear"],1,
 "Preoperational children use magical thinking; simple, honest explanations correct guilt-based beliefs.",
 "Agreeing reinforces guilt; dismissing or withholding information increases anxiety.",
 "Ipaliwanag nang simple na gamot ito at hindi niya kasalanan.","ml_ped");
Q(2,'gd',2,"An infant sits without support, passes a toy from one hand to the other and babbles. What age is most typical?",
 ["2 months","3 months","6 months","12 months"],2,
 "Sitting without support, transferring objects and babbling are typical around 6 months.",
 "At 2–3 months infants lift the head and coo; at 12 months they pull to stand and may walk with support.",
 "Karaniwan sa edad na mga 6 na buwan.","ml_ped","Milestone ages are ranges; children vary.");
Q(2,'ped',2,"An 18-month-old has cough, respiratory rate 44/min, no chest indrawing and no danger signs. Using an IMCI-type classification, this child has:",
 ["No pneumonia: cough or cold","Pneumonia (fast breathing, no severe signs)","Severe pneumonia","Asthma"],1,
 "Fast breathing is ≥40/min for ages 12–59 months; without chest indrawing or danger signs it is classified as pneumonia, not severe.",
 "A normal rate would be a cold; severe pneumonia needs chest indrawing or danger signs; asthma is not defined by respiratory rate alone.",
 "≥40/min sa 12–59 buwan ay mabilis na paghinga: pneumonia na hindi malala.","who_peds","Breathing-rate thresholds and pathways are revised periodically; follow current IMCI/DOH.");
Q(2,'ped',2,"A 3-year-old with diarrhea is restless, has sunken eyes, drinks eagerly, and the skin pinch returns slowly. What is the best initial management at the health center?",
 ["Withhold fluids for 4 hours","Give oral rehydration solution under observation, plus zinc","Start antibiotics","Give an anti-diarrheal drug"],1,
 "These are signs of some dehydration. Supervised oral rehydration with ORS and zinc supplementation is first-line.",
 "Withholding fluids worsens dehydration; most diarrhea is not bacterial; anti-diarrheals are not recommended in young children.",
 "Bigyan ng ORS habang binabantayan, at zinc.","who_peds","Quantities and zinc duration follow current guidance.");
Q(2,'ped',1,"What is usually the first physical sign of puberty in girls?",
 ["Menarche","Breast budding (thelarche)","Axillary hair","Peak height velocity"],1,
 "Thelarche, the start of breast development, usually comes first; menarche typically follows about 2–3 years later.",
 "Menarche, axillary hair and peak growth come later in the sequence.",
 "Ang unang palatandaan ay thelarche o paglaki ng dibdib.","ml_ped");
Q(2,'ped',2,"Which woman meets the criteria for the lactational amenorrhea method (LAM) of family planning?",
 ["3 months postpartum, mixed feeding with formula, no menses","8 months postpartum, breastfeeding, no menses","2 months postpartum, exclusively breastfeeding, menses has returned","4 months postpartum, exclusively breastfeeding, no menses"],3,
 "LAM requires all three: baby under 6 months, exclusive (or almost exclusive) breastfeeding, and no return of menses.",
 "Each other option fails at least one criterion (feeding pattern, age over 6 months, or return of menses).",
 "Kailangan ang tatlo: wala pang 6 na buwan, eksklusibong pagpapasuso, at wala pang regla.","doh","Method eligibility follows current DOH family planning guidance.");

/* ---------- Nursing Practice III ---------- */
Q(3,'periop',1,"Before giving a preoperative sedative, the nurse should first verify that:",
 ["Visiting hours are over","The client has had a light breakfast","The signed informed consent is on the chart","The surgical site has been shaved"],2,
 "Consent must be obtained (by the surgeon) while the client is alert; sedatives can impair decision-making, so verify it first.",
 "Visiting hours are irrelevant; the client should be NPO per orders; hair removal is not a prerequisite for sedation.",
 "Tiyaking pirmado na ang informed consent bago magbigay ng sedative.","openrn");
Q(3,'periop',1,"In the PACU, what is the first priority for a client emerging from general anesthesia?",
 ["Assessing pain level","Maintaining a patent airway","Checking the dressing","Offering oral fluids"],1,
 "Airway comes first (ABC); residual anesthesia and secretions can obstruct the airway.",
 "Pain, dressing checks and fluids are important but follow airway, breathing and circulation.",
 "Airway muna ang una sa ABC.","openrn");
Q(3,'periop',2,"Which instruction is correct for using an incentive spirometer after surgery?",
 ["Exhale forcefully into the device","Inhale slowly and deeply, hold 3–5 seconds, then exhale; repeat regularly while awake","Take quick shallow breaths","Use it once a day"],1,
 "Slow, sustained maximal inhalation with a breath-hold expands alveoli and prevents atelectasis; repeated regularly while awake.",
 "Forceful exhalation, shallow breaths or rare use do not expand the lungs.",
 "Huminga nang mabagal at malalim, hawakan 3–5 segundo, ulitin nang madalas.","openrn","Frequency (commonly hourly while awake) follows the order.");
Q(3,'periop',3,"On day 5 after abdominal surgery, a nurse finds loops of bowel protruding through the incision. What is the first action?",
 ["Push the bowel back in gently","Cover with sterile dressing moistened with sterile saline, keep the client supine with knees flexed, stay with the client and call the surgeon","Apply a dry dressing and have the client walk","Irrigate with tap water"],1,
 "Evisceration is a surgical emergency: protect tissue with moist sterile saline dressing, reduce abdominal strain, do not reinsert, and call for help.",
 "Pushing bowel back risks injury and infection; dry dressings stick; walking increases strain; tap water is not sterile.",
 "Takpan ng sterile na gasa na basa sa saline, huwag ibalik ang bituka, tumawag sa surgeon.","openrn");
Q(3,'resp',3,"Which finding in a client with a chest drainage system should be reported immediately?",
 ["Water-seal level rising and falling with breathing","Continuous bubbling in the water-seal chamber","Gentle bubbling in the suction-control chamber","30 mL of serosanguineous drainage in one hour"],1,
 "Continuous bubbling in the water-seal chamber indicates an air leak (in the system or lung).",
 "Tidaling is expected; gentle bubbling in the suction chamber is normal when suction is on; small serosanguineous drainage is expected early on.",
 "Tuloy-tuloy na bula sa water-seal ay air leak.","openstax","Drainage-system types and thresholds vary by device and provider orders.");
Q(3,'resp',2,"A client with COPD and chronic CO2 retention is prescribed oxygen. Which approach is appropriate?",
 ["High-flow oxygen at 15 L/min routinely","Low-flow oxygen titrated to the prescribed target (commonly SpO₂ 88–92%) with close monitoring","No oxygen even if hypoxemic","Oxygen only at night"],1,
 "Oxygen is titrated to a target range to treat hypoxemia while avoiding worsening hypercapnia.",
 "Routine high-flow can suppress ventilation and raise CO2; withholding oxygen from a hypoxemic client is unsafe.",
 "Mababang daloy ng oxygen na naka-titrate sa target na SpO₂.","gold","Oxygen targets follow the provider's order and current guidelines.");
Q(3,'resp',2,"A child in a severe asthma attack was wheezing loudly but now has quiet breath sounds and is drowsy. What does this indicate?",
 ["Improvement","Impending respiratory failure requiring emergency escalation","Anxiety only","Resolution of bronchospasm"],1,
 "A ‘silent chest’ with drowsiness means very little air is moving: a life-threatening sign.",
 "Improvement would show easier breathing, alertness and audible air movement.",
 "Ang tahimik na dibdib at antok ay babala ng malapit na respiratory failure.","ml_resp");
Q(3,'ab',2,"ABG results: pH 7.30, PaCO₂ 52 mm Hg, HCO₃⁻ 26 mEq/L. What is the interpretation?",
 ["Metabolic acidosis","Respiratory acidosis","Respiratory alkalosis","Metabolic alkalosis"],1,
 "Low pH with high PaCO₂ and normal bicarbonate indicates uncompensated respiratory acidosis.",
 "Metabolic acidosis would show low HCO₃⁻; alkalosis would show pH above 7.45.",
 "Mababang pH at mataas na PaCO₂: respiratory acidosis.","openstax");
Q(3,'ab',2,"A client with diabetic ketoacidosis has pH 7.30, PaCO₂ 30 mm Hg, HCO₃⁻ 14 mEq/L. What is the interpretation?",
 ["Respiratory acidosis, uncompensated","Metabolic acidosis, partially compensated","Metabolic alkalosis","Respiratory alkalosis"],1,
 "Low pH and low bicarbonate indicate metabolic acidosis; the lowered PaCO₂ shows respiratory compensation, but pH is still acidic so compensation is partial.",
 "A low CO₂ is not a primary respiratory alkalosis here because the pH is acidic.",
 "Mababang pH at HCO₃⁻, mababa rin ang CO₂: metabolic acidosis na bahagyang na-compensate.","openstax");
Q(3,'fe',2,"A client in kidney failure has serum potassium 6.8 mEq/L. Which ECG change is expected?",
 ["Prominent U waves","ST depression with U waves","Tall, peaked T waves","Shortened QT interval"],2,
 "Hyperkalemia causes tall, peaked T waves, then widened QRS and eventually arrhythmias.",
 "U waves and ST depression suggest hypokalemia; a shortened QT suggests hypercalcemia.",
 "Ang hyperkalemia ay nagpapakita ng matataas na T waves.","openstax");
Q(3,'fe',3,"Which action is unsafe when administering potassium chloride?",
 ["Diluting it and infusing via an infusion pump","Giving it by IV push","Checking urine output before giving it","Monitoring cardiac rhythm during rapid replacement"],1,
 "IV push potassium can cause fatal cardiac arrest; it must be diluted and infused slowly.",
 "The other actions are recommended safety measures.",
 "Mapanganib ang IV push ng potassium; dapat diluted at dahan-dahan.","openstax","Concentration and rate limits follow facility policy.");
Q(3,'fe',2,"A client with SIADH has serum sodium 122 mEq/L. Which order should the nurse expect?",
 ["Free water boluses","Fluid restriction","5% dextrose in water infusion","Unrestricted oral fluids"],1,
 "SIADH causes water retention and dilutional hyponatremia; fluid restriction is the mainstay.",
 "Adding free water worsens dilution.",
 "Fluid restriction ang pangunahing lunas sa SIADH.","openstax","Severe symptomatic hyponatremia may need hypertonic saline under specialist orders.");
Q(3,'fe',2,"Twelve hours after thyroidectomy, a client has perioral tingling and a positive Chvostek's sign. What do these findings suggest?",
 ["Hyperkalemia","Hypocalcemia","Hypernatremia","Hypermagnesemia"],1,
 "Perioral tingling, positive Chvostek's/Trousseau's signs suggest hypocalcemia from parathyroid injury or removal; report promptly.",
 "The other imbalances do not typically cause neuromuscular irritability with these signs.",
 "Pangingilig sa palibot ng bibig at positibong Chvostek: hypocalcemia.","ml_thy");
Q(3,'fe',1,"Which laboratory finding is expected in dehydration?",
 ["Decreased urine specific gravity","Increased urine specific gravity","Decreased hematocrit","Decreased BUN"],1,
 "Concentrated urine (high specific gravity), with raised hematocrit and BUN, accompanies fluid volume deficit.",
 "Dilution, not dehydration, causes a lower specific gravity and hematocrit.",
 "Sa dehydration, tumataas ang urine specific gravity.","openstax");
Q(3,'inf',3,"A nurse sustains a needlestick from a used hollow-bore needle used on a client with HIV. What is the best immediate action?",
 ["Squeeze the site hard and apply iodine","Wash with soap and water, then report immediately so post-exposure prophylaxis can be started without delay","Finish the shift and report next week","Cover with a plaster and monitor for symptoms"],1,
 "Wash the site, report immediately, and get urgent assessment: PEP is most effective when started as soon as possible.",
 "Squeezing or caustic agents are not recommended; delay and passive monitoring lose the PEP window.",
 "Hugasan, iulat agad at magpa-assess para sa PEP nang walang pagkaantala.","ml_hiv","Follow your facility's exposure protocol and current PEP guidelines.");
Q(3,'inf',1,"Which medication is the first-line immediate treatment for anaphylaxis?",
 ["IV diphenhydramine","Intramuscular epinephrine","Oral prednisone","Salbutamol alone"],1,
 "Epinephrine IM (anterolateral thigh) is first-line; antihistamines and steroids are adjuncts.",
 "Adjuncts do not reverse airway edema or shock quickly enough.",
 "Epinephrine IM ang unang gamot sa anaphylaxis.","openstax","Doses and routes follow current emergency protocol.");
Q(3,'inf',2,"A tuberculin skin test is read 48–72 hours after injection. Which hypersensitivity type does it represent?",
 ["Type I","Type II","Type III","Type IV"],3,
 "Type IV is delayed, T-cell–mediated hypersensitivity (also contact dermatitis).",
 "Type I is immediate IgE-mediated; type II is antibody-mediated cytotoxic; type III is immune-complex mediated.",
 "Type IV ang delayed hypersensitivity, gaya ng TST.","ml_tb");
Q(3,'inf',2,"A client has suspected pulmonary tuberculosis. Which precautions are appropriate?",
 ["Contact precautions with gown only","Airborne precautions: negative-pressure room if available and N95 respirator for staff","Droplet precautions with surgical mask only","Standard precautions only"],1,
 "TB spreads by airborne droplet nuclei; airborne precautions with a fit-tested N95 respirator are required.",
 "Surgical masks and gowns alone do not stop droplet nuclei.",
 "Airborne precautions at N95 ang kailangan sa TB.","cdc_iso");
Q(3,'onc',1,"Which nutrient is most directly needed for collagen synthesis during wound healing?",
 ["Vitamin K","Vitamin C","Vitamin D","Vitamin B12"],1,
 "Vitamin C is a cofactor for collagen formation; protein and zinc also support healing.",
 "Vitamin K supports clotting, vitamin D calcium balance and B12 red-cell formation.",
 "Vitamin C ang kailangan sa pagbuo ng collagen.","who_diet");
Q(3,'onc',2,"A client receiving chemotherapy has an absolute neutrophil count of 400/mm³. Which teaching is appropriate?",
 ["Use a rectal thermometer for accuracy","Avoid crowds and sick contacts and report a fever promptly","Eat raw salads for vitamins","Share a bathroom with a child with a cold"],1,
 "Severe neutropenia raises infection risk; avoid exposures, practice hand hygiene and report fever immediately.",
 "Rectal temperatures risk mucosal injury; raw foods and sick contacts increase infection risk.",
 "Iwasan ang maraming tao at may sakit; iulat agad ang lagnat.","ml_cancer","Fever thresholds and neutropenia precautions follow oncology unit policy.");
Q(3,'onc',2,"Fifteen minutes into a red-cell transfusion the client develops chills, fever and flank pain. What is the first action?",
 ["Slow the rate and recheck in 15 minutes","Stop the transfusion, keep the vein open with 0.9% saline using new tubing, and notify the provider and blood bank","Give acetaminophen and continue","Flush the line with dextrose"],1,
 "Suspected acute hemolytic reaction: stop the blood immediately, maintain IV access with saline, check identification, and notify per protocol.",
 "Slowing or continuing the transfusion lets more incompatible blood enter; dextrose can hemolyze red cells.",
 "Itigil agad ang pagsasalin, panatilihing bukas ang IV ng NSS at ipaalam.","openstax","Follow facility transfusion-reaction protocol.");

/* ---------- Nursing Practice IV ---------- */
Q(4,'nut',2,"A client with long-term heavy alcohol use is confused, ataxic and has abnormal eye movements. Deficiency of which vitamin is most likely?",
 ["Niacin","Vitamin C","Thiamine (B1)","Vitamin A"],2,
 "Confusion, ataxia and ophthalmoplegia describe Wernicke encephalopathy from thiamine deficiency; thiamine is given before or with glucose.",
 "Niacin deficiency gives dermatitis, diarrhea and dementia; vitamin C deficiency gives scurvy; vitamin A deficiency affects vision and epithelium.",
 "Ang kakulangan sa thiamine ang sanhi ng Wernicke encephalopathy.","who_diet");
Q(4,'nut',1,"A nurse teaches a client about ferrous sulfate tablets. Which advice is most appropriate?",
 ["Take with milk to prevent stomach upset","Take with a vitamin C–containing fluid if tolerated, and expect dark stools","Take with antacids","Stop if stools turn black"],1,
 "Vitamin C improves iron absorption; dark green-black stools are expected. Milk and antacids reduce absorption.",
 "Dark stools from iron are harmless, but tarry stools with pain or dizziness should be reported.",
 "Inumin kasama ng vitamin C; normal ang maitim na dumi.","ml_gi");
Q(4,'nut',2,"A client with chronic kidney disease is told to limit potassium. Which snack choice is best?",
 ["Banana","Baked potato with skin","Orange juice","Apple slices"],3,
 "Apples are relatively low in potassium; bananas, potatoes and orange juice are high.",
 "The other choices are high-potassium foods.",
 "Mababa sa potassium ang mansanas.","who_diet","Individual restrictions depend on lab results and the dietitian's plan.");
Q(4,'nut',1,"Which food is naturally safe for a client with celiac disease?",
 ["Whole-wheat bread","Barley soup","Plain rice","Rye crackers"],2,
 "Celiac disease requires avoiding gluten (wheat, barley, rye); plain rice is gluten-free.",
 "The other foods contain gluten.",
 "Walang gluten ang kanin; iwasan ang trigo, barley at rye.","ml_gi");
Q(4,'gi',1,"Which statement by a client with GERD shows understanding of teaching?",
 ["“I'll lie down right after dinner to digest.”","“I'll avoid lying down for 2–3 hours after meals and raise the head of my bed.”","“I'll have coffee before bed.”","“I'll wear tight belts to support my stomach.”"],1,
 "Upright posture after meals and head elevation reduce reflux; late meals, caffeine and abdominal pressure worsen it.",
 "The others increase reflux or intra-abdominal pressure.",
 "Iwasang humiga 2–3 oras pagkatapos kumain at itaas ang ulo ng kama.","ml_gi");
Q(4,'gi',2,"Which finding best suggests a gastric ulcer rather than a duodenal ulcer?",
 ["Pain relieved by eating, occurring 2–3 hours after meals and at night","Epigastric pain 30–60 minutes after eating, with weight loss","Weight gain with eating","Pain only with exercise"],1,
 "Gastric ulcer pain tends to worsen soon after eating, often with weight loss; duodenal ulcer pain is relieved by food and occurs hours later.",
 "Relief with food and night pain describe duodenal ulcer; the others are not typical.",
 "Ang sakit ng gastric ulcer ay lumalala pagkakain at maaaring may pagbaba ng timbang.","ml_gi");
Q(4,'gi',2,"Which finding suggests ulcerative colitis rather than Crohn's disease?",
 ["Skip lesions throughout the GI tract","Continuous inflammation starting in the rectum with bloody diarrhea","Perianal fistulas","Transmural inflammation with strictures"],1,
 "Ulcerative colitis involves continuous mucosal inflammation from the rectum upward with bloody diarrhea.",
 "Skip lesions, fistulas and transmural disease are typical of Crohn's disease.",
 "Tuloy-tuloy na pamamaga mula rectum na may dugong pagtatae: ulcerative colitis.","ml_gi");
Q(4,'gi',2,"Which action is inappropriate for a client with suspected appendicitis awaiting evaluation?",
 ["Keeping the client NPO","Applying a heating pad to the abdomen","Assessing pain location and character","Positioning comfortably with knees flexed"],1,
 "Heat may increase blood flow and risk rupture; laxatives and enemas are also avoided.",
 "NPO, assessment and comfortable positioning are appropriate.",
 "Huwag maglagay ng init sa tiyan; maaaring pumutok ang appendix.","ml_gi");
Q(4,'hep',2,"A client with cirrhosis and hepatic encephalopathy is prescribed lactulose. What is its purpose?",
 ["To increase protein absorption","To promote excretion of ammonia in the stool","To treat ascites by diuresis","To lower bilirubin directly"],1,
 "Lactulose acidifies the colon, traps ammonia as ammonium and produces loose stools that remove it.",
 "It is a nonabsorbed disaccharide laxative, not a diuretic or protein supplement.",
 "Tinutulungan ng lactulose na mailabas ang ammonia sa dumi.","ml_gi");
Q(4,'hep',1,"Hepatitis A is primarily transmitted by:",
 ["Blood and contaminated needles","The fecal–oral route through contaminated food or water","Respiratory droplets","Mosquito bites"],1,
 "Hepatitis A spreads through contaminated food or water and poor hand hygiene.",
 "Blood and needles describe hepatitis B/C; droplets and mosquitoes are not routes for hepatitis A.",
 "Fecal–oral ang daan ng hepatitis A.","ml_gi");
Q(4,'hep',2,"A client has severe epigastric pain radiating to the back and vomiting. Which laboratory test is most specific for acute pancreatitis?",
 ["Serum creatinine","Serum lipase","Serum sodium","Hemoglobin"],1,
 "Serum lipase rises early and stays elevated, and is more specific than amylase.",
 "Creatinine, sodium and hemoglobin do not diagnose pancreatitis.",
 "Ang lipase ang pinaka-tiyak na pagsusuri sa pancreatitis.","ml_gi");
Q(4,'hep',2,"In acute cholecystitis, a positive Murphy's sign is shown when the client:",
 ["Has pain in the right lower quadrant on release of pressure","Stops inhaling when the right upper quadrant is palpated under the costal margin","Has bruising of the flanks","Feels pain relieved by eating"],1,
 "Inspiratory arrest on palpation of the RUQ as the inflamed gallbladder touches the examiner's hand is Murphy's sign.",
 "RLQ rebound relates to appendicitis; flank bruising is Grey Turner's sign.",
 "Humihinto sa paghinga ang pasyente kapag pinindot ang kanang itaas na tiyan.","ml_gi");
Q(4,'dm',1,"A conscious client on insulin is sweaty and shaky with a glucose of 58 mg/dL. What is the first action?",
 ["Give an IV bolus of insulin","Give a high-fat snack","Give 15 g of fast-acting carbohydrate (e.g., 120 mL juice) and recheck in 15 minutes","Wait for the next meal"],2,
 "Treat hypoglycemia promptly with about 15 g of fast-acting carbohydrate and recheck in 15 minutes (the ‘rule of 15’).",
 "Insulin worsens hypoglycemia; fat slows absorption; waiting is unsafe.",
 "15 g na mabilis na carbohydrate at ulitin ang pagsukat pagkalipas ng 15 minuto.","ada","Thresholds and amounts follow facility protocol and current standards.");
Q(4,'dm',2,"When mixing regular and NPH insulin in one syringe, the nurse should:",
 ["Draw up NPH first, then regular","Draw up regular (clear) insulin first, then NPH (cloudy)","Always use separate syringes","Shake the NPH vial vigorously"],1,
 "‘Clear before cloudy’ prevents contaminating the regular insulin vial with NPH; NPH is gently rolled to resuspend.",
 "Reversing the order risks altering regular insulin action; shaking creates bubbles and dose errors.",
 "Clear muna bago cloudy: regular bago NPH.","ada");
Q(4,'dm',3,"A client has glucose 540 mg/dL, Kussmaul respirations, fruity breath, BP 90/55 mm Hg and HR 118. What is the initial priority?",
 ["Administer a sodium bicarbonate bolus","Start IV isotonic fluid replacement per orders and monitor potassium and glucose","Encourage oral fluids and a snack","Hold insulin indefinitely"],1,
 "Diabetic ketoacidosis causes severe volume depletion; isotonic fluids come first, then insulin once potassium is confirmed adequate.",
 "Bicarbonate is rarely indicated; oral fluids are inadequate; insulin is needed after fluids and potassium check.",
 "Una ang IV isotonic fluids, subaybayan ang potassium at glucose.","ada","DKA protocols follow current standards and provider orders.");
Q(4,'endo',1,"Which teaching about levothyroxine is correct?",
 ["Take with breakfast and a calcium supplement","Take on an empty stomach 30–60 minutes before breakfast at the same time daily","Take at bedtime with milk","Stop when you feel better"],1,
 "Levothyroxine absorbs best fasting and consistently timed; calcium and iron interfere.",
 "Food, calcium and milk reduce absorption; therapy is usually lifelong.",
 "Inumin nang walang laman ang tiyan, 30–60 minuto bago mag-almusal.","ml_thy");
Q(4,'endo',3,"A client with Addison's disease missed hydrocortisone doses and now has vomiting, BP 78/50 mm Hg, confusion, Na 125, K 6.0 and glucose 52 mg/dL. What is the priority?",
 ["Restrict fluids","Give potassium supplements","Give IV hydrocortisone and isotonic fluids urgently as ordered","Offer oral fluids and rest"],2,
 "This is adrenal crisis, which is life-threatening; urgent glucocorticoid and volume replacement are needed.",
 "Fluid restriction and potassium worsen the crisis; oral fluids are insufficient.",
 "Adrenal crisis: agarang hydrocortisone at IV fluids.","ml_thy");
Q(4,'sens',2,"A client reports sudden severe eye pain, halos around lights, blurred vision and nausea. What is the priority?",
 ["Schedule a routine eye exam next month","Report immediately; this may be acute angle-closure glaucoma, an emergency","Apply a warm compress","Reassure that it is a migraine"],1,
 "Acute angle-closure glaucoma can cause permanent vision loss within hours and needs urgent treatment.",
 "Delay, compresses or assuming migraine risk blindness.",
 "Posibleng acute angle-closure glaucoma; emergency ito.","ml_eye");
Q(4,'sens',1,"When instilling ear drops for an adult, the nurse should:",
 ["Pull the pinna down and back","Pull the pinna up and back","Pull the pinna forward","Leave the pinna in place"],1,
 "Pulling the adult pinna up and back straightens the ear canal; for children under 3 it is pulled down and back.",
 "Other directions do not straighten the canal.",
 "Sa matanda, hilahin ang tainga pataas at paatras.","openrn");
Q(4,'neuro',3,"Which finding is a late sign of increased intracranial pressure?",
 ["Restlessness","Bradycardia with widening pulse pressure and irregular respirations","Mild headache","Tachycardia with narrowing pulse pressure"],1,
 "Cushing's triad (hypertension with widened pulse pressure, bradycardia, irregular breathing) is a late, ominous sign.",
 "Restlessness and mild headache are early signs; tachycardia is not part of Cushing's triad.",
 "Cushing's triad ang huling senyales ng tumaas na ICP.","openstax");
Q(4,'neuro',2,"A client arrives with sudden facial droop and slurred speech. Which information is most critical to obtain immediately?",
 ["Dietary history for the past year","The exact time the client was last known to be well","Occupation","Immunization record"],1,
 "Time last known well determines eligibility for time-sensitive treatments such as thrombolysis or thrombectomy.",
 "The other items do not determine emergency treatment windows.",
 "Mahalaga ang eksaktong oras na huling nakitang maayos ang pasyente.","ml_neuro","Treatment time windows follow current stroke guidelines and local protocols.");

/* ---------- Nursing Practice V ---------- */
Q(5,'mh',2,"A client says, “People are following me to hurt me.” Which response is best?",
 ["“Nobody is following you; that's impossible.”","“I don't see anyone following you, but I can tell you feel frightened.”","“Who is following you and why?”","“Yes, I'll make sure they can't hurt you.”"],1,
 "Acknowledge the feeling without confirming or arguing with the delusion, and offer reality-based reassurance.",
 "Flat denial invites argument; probing details reinforces the delusion; agreeing validates it.",
 "Kilalanin ang takot nang hindi kinukumpirma ang maling paniniwala.","who_mhgap");
Q(5,'mh',3,"A client says, “Everyone would be better off without me.” What is the best next step?",
 ["Change the subject to something cheerful","Ask directly whether the client is thinking about suicide and whether there is a plan","Promise to keep the statement secret","Tell the client that life is worth living"],1,
 "Asking directly and calmly about suicidal thoughts and plans does not increase risk and allows safety measures. Stay with the client and follow your facility's risk protocol.",
 "Avoiding the topic, promising secrecy or giving quick reassurance shuts down communication and delays safety planning.",
 "Direktang tanungin kung may iniisip na magpakamatay at may plano; manatili sa tabi at sundin ang protocol.","who_mhgap","Follow facility suicide-risk assessment and escalation protocol.");
Q(5,'mh',2,"A client in a panic attack is breathless and trembling and says, “I'm dying.” What is the best action?",
 ["Leave the client alone to calm down","Stay with the client, use short calm sentences and guide slow breathing in a quiet space","Explain the physiology of anxiety in detail","Encourage the client to face the fear immediately"],1,
 "In acute panic, concentration is limited; presence, brief direction and a calm environment reduce anxiety. (Rule out medical causes if symptoms are atypical.)",
 "Leaving increases fear; long explanations and confrontation exceed the client's capacity at that moment.",
 "Manatili, magsalita nang maikli at mahinahon, gabayan ang paghinga.","who_mhgap");
Q(5,'mh',2,"Which is required before applying physical restraints to an agitated client?",
 ["Restraints may be used for staff convenience","Less restrictive alternatives were tried or considered, with a valid order and close monitoring per policy","A PRN order lasting several days","Verbal permission from family only"],1,
 "Restraint is a last resort, time-limited, ordered by an authorized provider per policy, with frequent monitoring and documentation.",
 "Convenience, open-ended orders and family permission alone do not meet safety or legal standards.",
 "Huling opsyon ang restraint; dapat may order, mahigpit na pagsubaybay at dokumentasyon.","openrn","Restraint rules vary by law and facility policy.");
Q(5,'drug',3,"A client taking haloperidol suddenly has neck twisting and eyes rolled upward. What is the most likely problem and expected action?",
 ["Tardive dyskinesia; schedule routine follow-up","Anxiety; give an extra dose of haloperidol","Acute dystonia; notify the provider—an anticholinergic such as benztropine is usually ordered","A normal response needing no action"],2,
 "Sudden muscle spasms of the neck, jaw or eyes soon after starting an antipsychotic are acute dystonia, a treatable extrapyramidal reaction.",
 "Tardive dyskinesia develops after long-term use; extra haloperidol worsens it.",
 "Acute dystonia ito; ipaalam sa provider, karaniwang anticholinergic ang ibinibigay.","ml_mh");
Q(5,'drug',3,"A client on an antipsychotic has temperature 40 °C, severe muscle rigidity, confusion, unstable blood pressure and a high CK. What is the priority?",
 ["Give the next scheduled antipsychotic dose","Hold the antipsychotic and notify the provider urgently; suspect neuroleptic malignant syndrome and begin supportive care per orders","Encourage fluids and rest","Give extra antipsychotic for agitation"],1,
 "Neuroleptic malignant syndrome is a medical emergency: stop the offending drug and give urgent supportive care.",
 "More antipsychotic worsens the condition; rest and fluids are insufficient.",
 "Itigil ang antipsychotic at ipaalam agad; posibleng NMS.","ml_mh");
Q(5,'drug',2,"Which teaching is correct for a client taking lithium?",
 ["Restrict sodium and fluids to avoid toxicity","Keep normal salt and fluid intake and attend scheduled lithium blood tests","Stop the drug once you feel well","Expect no side effects"],1,
 "Low sodium or dehydration raises lithium levels; consistent intake and monitoring are essential.",
 "Restricting salt raises toxicity risk; stopping abruptly risks relapse.",
 "Panatilihin ang normal na asin at likido; magpa-lithium level.","ml_mh");
Q(5,'drug',2,"A client is prescribed phenelzine (an MAOI). Which food should be avoided?",
 ["Fresh fruit","Aged cheese","Plain rice","Boiled egg"],1,
 "Tyramine-rich foods (aged cheese, cured meats, fermented products) can trigger hypertensive crisis with MAOIs.",
 "The other foods are low in tyramine.",
 "Iwasan ang aged cheese dahil sa tyramine.","ml_mh");
Q(5,'drug',2,"After one week on fluoxetine, a client says it isn't working and wants to stop. What is the best teaching?",
 ["Double the dose","Stop the medicine since it isn't working","Full benefit often takes several weeks; do not stop abruptly and discuss concerns with the provider","Add alcohol to help it work"],2,
 "Antidepressant effects typically build over 2–6 weeks, and sudden discontinuation can cause withdrawal symptoms.",
 "Self-adjusting the dose or adding alcohol is unsafe.",
 "Inaabot ng ilang linggo bago ang buong bisa; huwag biglang ihinto.","ml_mh");
Q(5,'mh',3,"Seventy-two hours after the last drink, a client is disoriented, sees insects on the walls, and has temperature 38.6 °C, HR 124 and tremors. What is the most likely condition and priority?",
 ["A usual hangover; encourage rest","Dementia; arrange discharge","Anxiety; reassure and observe","Alcohol withdrawal delirium (delirium tremens), a medical emergency; notify the provider, monitor closely and expect benzodiazepines"],3,
 "Disorientation, hallucinations, fever and autonomic hyperactivity 48–96 h after the last drink indicate delirium tremens, which can be fatal.",
 "Hangover, dementia and simple anxiety do not explain autonomic instability and hallucinations.",
 "Delirium tremens ito: emergency; ipaalam, subaybayan at benzodiazepines.","who_mhgap","Withdrawal scoring (e.g., CIWA) and drug choices follow facility protocol.");
Q(5,'card',2,"A client has crushing chest pain radiating to the left arm with diaphoresis. After calling for help and obtaining an ECG, which drug is usually given promptly unless contraindicated?",
 ["Oral acetaminophen","Ibuprofen","Chewed aspirin","An antacid"],2,
 "Aspirin inhibits platelets and reduces mortality in suspected acute coronary syndrome.",
 "Acetaminophen and ibuprofen do not provide this antiplatelet effect (NSAIDs may harm); antacids do not treat ischemia.",
 "Chewable aspirin maliban kung may contraindication.","ml_heart","Medication orders and protocols vary; follow provider and local ACS protocol.");
